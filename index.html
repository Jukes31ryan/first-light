and none of it reached him. He begged Dionysius to let him leave. He said he no longer wished to be fortunate.\n\nDionysius had made his point. He had lived under that sword every day of his reign: the constant possibility of assassination, revolt, betrayal by anyone in the room. It came with the couch. It was not separable from it.","m":"Every position you envy has a sword over the couch. You just can't see it from where you're standing."},{"t":"The Gordian Knot","s":"In the city of Gordium there was an ox-cart lashed to a post with a knot of cornel bark so intricate that no one could find the ends of it. An oracle had declared that whoever untied the knot would rule all of Asia.\n\nFor generations, men had tried. Kings, generals, clever men with clever fingers. They studied it, traced the loops, worked at it for hours, and left.\n\nIn 333 BC, Alexander of Macedon arrived and was shown the knot.\n\nHe examined it for a while. He could not find the ends either. Then he stepped back, drew his sword, and cut the knot through in a single stroke.\n\nThere was an argument about it afterward, and there still is. Some said he had cheated — that the oracle plainly meant untying. Others pointed out that the oracle had never actually specified how, only that the knot must be undone, and Alexander had undone it.\n\nHe went on to take Asia.\n\nA quieter version survives too, recorded by Aristobulus, who served in Alexander's army: that he simply pulled the pole out of the cart, which exposed the ends of the rope, and then untied it easily. In that telling, he didn't cut anything. He just stopped accepting the terms everyone else had assumed.","m":"The rules of the problem you're stuck on may be ones you invented. Check what's actually required before you spend another hour on the knot."},{"t":"Odysseus and the Mast","s":"Odysseus knew what was coming. The witch Circe had warned him: the ship's route passed the island of the Sirens, whose song was so beautiful that every sailor who heard it steered toward the rocks and died there. The shore was piled with bones.\n\nHe wanted to hear it. He was perhaps the only man in the world who wanted both to hear the song and to survive it.\n\nSo he made a plan while he was still calm and still miles away, because he knew he would not be either when the time came.\n\nHe had his men fill their own ears with beeswax so they could hear nothing at all. Then he had them tie him upright to the mast, hand and foot, and he gave them an order: no matter what he did, no matter what he shouted, no matter how he begged or commanded or threatened them, they were to keep rowing and they were not to release him. If he signaled to be untied, they were to bind him tighter.\n\nThe song came. It was everything he had been told. He strained against the ropes until they cut him, he screamed at his crew, he ordered them as their king to let him go.\n\nThey could not hear him. They rowed.\n\nAnd when the island was behind them, they cut him loose, and he was the only man ever to hear that song and live.","m":"Decide now, while you're clear-headed, what future-you isn't allowed to renegotiate. Then make it hard to undo."},{"t":"The Choice of Heracles","s":"The story is Prodicus's, told by Xenophon, and it finds Heracles as a young man at the age when a life starts to take shape.\n\nHe went out alone to a quiet place to think about which way to go, and while he sat there, two women came to him.\n\nThe first was striking and heavily made up, dressed to be looked at, and she kept glancing at her own shadow to check the effect. She got there first and spoke quickly.\n\n“Heracles, I see you can't decide. Come with me and I'll take you by the easiest road. You'll taste every pleasure and never touch a hardship. You won't think about wars or business. You'll think about what you'd like to eat and drink, what would be pleasant to see and hear and smell and touch, which company would delight you most, and how you might sleep most softly and get all of it with the least effort.”\n\n“What is your name?”\n\n“My friends call me Happiness,” she said. “My enemies call me Vice.”\n\nThe second woman came forward then. She was plainly dressed and her expression was steady.\n\n“I come to you too, Heracles, and I will not deceive you with promises of pleasure. I will tell you the truth of how the gods have ordered things.\n\n“Of all that is good and fair, the gods give nothing to men without effort and labor. If you want the favor of the gods, worship them. If you want to be loved by your friends, do good to them. If you want a city to honor you, be of service to it. If you want the earth to yield you fruit, you must farm it. If you want a body that obeys you, you must train it, and train it with sweat.”\n\nHer name was Virtue. Heracles went with her.","m":"The easy road advertises itself and gets there first. The other one tells you the price up front, which is how you know it's honest."},{"t":"The Crow and the Pitcher","s":"A crow, half dead with thirst after a long dry summer, came upon a pitcher that had once been full of water.\n\nWhen she thrust her beak into the mouth of it, she found only a little water at the very bottom. Try as she might, she could not reach far enough down to get at it. She tried to knock the pitcher over, but it was too heavy. She tried to break it, and only hurt herself.\n\nShe was about to give up in despair when she noticed the pebbles scattered around the ground nearby.\n\nShe picked one up in her beak and dropped it into the pitcher. Then another. Then another. She kept at it, one pebble at a time, and the water rose a fraction with each one.\n\nAfter a long while, and a great many pebbles, the water reached the top, and the crow drank.\n\nThe story is at least two and a half thousand years old, and in 2009 researchers at Cambridge ran it as an experiment with actual rooks. The rooks solved it on the first attempt, and selected the larger stones first.","m":"The situation you can't force is often one you can raise, one small deposit at a time. Start with the biggest stone you have."},{"t":"The Goose and the Golden Eggs","s":"A cottager and his wife had a goose that laid a golden egg every morning.\n\nFor a while, this was simply astonishing, and they were careful with her. They fed her well. They kept her warm. Each day another egg, and slowly they became wealthy.\n\nBut supposing the goose to be made of gold inside — and impatient at getting only one egg a day — they began to think about how much was in there. A whole goose's worth. Sitting in the yard, doled out to them a spoonful at a time, while they waited.\n\nThey killed her and cut her open.\n\nShe was exactly like any other goose inside. And now there were no more eggs at all, because they had destroyed the only thing that had ever produced one.","m":"Whatever produces value for you — a relationship, your sleep, your attention — you can strip-mine it once or harvest it for years. Choose today."},{"t":"The North Wind and the Sun","s":"The North Wind and the Sun had an argument about which of them was stronger, and it went on long enough that they decided to settle it.\n\nA traveler was coming along the road below, wrapped in a heavy cloak. They agreed that whichever of them could make him take the cloak off would be judged the more powerful.\n\nThe North Wind went first. He gathered himself and blew — a hard, cold, tearing blast, the kind that strips leaves off trees. The traveler staggered.\n\nAnd he pulled his cloak tighter.\n\nThe Wind blew harder. He howled. He drove rain sideways into the man's face. The traveler bent forward, gripped the cloak with both hands, and wrapped it closer around himself than before. In the end the Wind gave up, exhausted, having achieved precisely the opposite of what he intended.\n\nThen the Sun came out from behind the clouds. He did nothing dramatic. He simply shone, mildly at first, and then with a gentle steady warmth.\n\nThe traveler straightened up. After a few minutes he loosened the cloak at his throat. A little further on he took it off entirely and carried it over his arm.","m":"Force makes people grip tighter. If you need someone to open up today, be warmth, not wind."},{"t":"The Milkmaid's Pail","s":"A farmer's daughter was carrying a pail of milk on her head, walking the long road to market, and as she walked she did the arithmetic.\n\nThe milk would sell for enough to buy three hundred eggs. Allowing for the ones that wouldn't hatch and the ones the weather would take, that was still two hundred and fifty chicks at least. They'd be ready for market just when poultry prices were highest, so by the new year she'd have money enough for a new gown.\n\nGreen, she decided. Green suited her. She would wear it to the Christmas fair, and every young man in the parish would want to dance with her, and she would refuse every one of them. She would toss her head and turn away, like this —\n\nThe pail came off her head and broke on the road, and the milk ran into the dust.\n\nShe went home and told her mother what had happened.\n\n“Ah, child,” said her mother. “Do not count your chickens before they are hatched.”","m":"The plan is not the milk. Get today's actual pail to market before you spend what it might become."},{"t":"The Lion and the Mouse","s":"A lion was asleep in the sun when a mouse ran across his face and woke him.\n\nHe pinned it under one paw and opened his mouth. The mouse begged: it had not meant to, it would never do it again, and if the lion spared it, perhaps one day it might repay the kindness.\n\nThe idea that a mouse could ever do anything for a lion was so funny that he let it go.\n\nSome weeks later, hunters caught the lion in a net of heavy rope and lashed it to a tree while they went to fetch a wagon to carry him alive to the king. He roared until the forest rang, and the ropes did not give at all.\n\nThe mouse heard him, and came, and recognized the voice.\n\nIt began to gnaw. It worked at one rope until the strands parted, then the next, then the next, taking hours, until the net came apart and the lion stepped free.\n\n“You laughed when I said I might repay you,” said the mouse. “Now you know that even a mouse can help a lion.”","m":"The person who can't do anything for you today may be the only one who can do something for you later. Also: be kind anyway."},{"t":"The Bundle of Sticks","s":"A father had sons who argued constantly. Nothing he said made any difference, and he began to worry about what would become of them after he was gone.\n\nOne day he told them to bring him a bundle of sticks. When they had, he tied the bundle tightly with cord and handed it to the eldest.\n\n“Break it.”\n\nThe boy put a knee into it and heaved with both arms, and the bundle did not give. Each brother tried in turn, red-faced, and none of them could bend it.\n\nThen the father untied the cord and spread the sticks out on the ground.\n\n“Now break them.”\n\nEach son picked one up and snapped it between two fingers without effort. In a minute the whole bundle was in pieces.\n\n“You see,” the father said. “While you hold together and help one another, you are as this bundle, and no trouble can harm you. Fall to arguing and separate yourselves, and you will be broken as easily as these sticks.”","m":"Whoever your bundle is — family, crew, marriage — the cord is maintained, not given. Tie it a little tighter today."},{"t":"Stone Soup","s":"Three soldiers, walking home from a war with nothing, came to a village at dusk. The villagers had had a bad harvest and worse visitors, and by the time the soldiers reached the square, every scrap of food in the place had been hidden — in cellars, under floorboards, buried in gardens. Everyone said the same thing: there is nothing here. We are starving ourselves.\n\n“That's a shame,” said the eldest soldier. “Then we'll have to make stone soup.”\n\nHe asked only for a great iron pot, water, and a fire, and the villagers, curious, provided all three. He drew a smooth gray stone from his pack with some ceremony, dropped it in, and stirred.\n\nAfter a while he tasted it and said it was coming along nicely. “Of course,” he added, “stone soup with cabbage — that's hard to beat.”\n\nA woman said she thought she might have one cabbage left, somewhere, and went to look.\n\nIt went in. He stirred and tasted. “The last time I had stone soup like this, it had a bit of salt beef in it as well. Fit for a rich man's table.”\n\nThe butcher remembered a little salt beef.\n\nAnd so it went: potatoes from one house, barley from another, carrots, an onion, and finally milk. Each person contributed one thing, believing they were adding to something that already existed.\n\nThat night the whole village ate better than it had in a year, and they danced afterward, and they told the soldiers they had never imagined so fine a soup could be made from a stone.","m":"People will give to something that's already started. Put the pot on the fire first, then ask."},{"t":"The Two Wolves","s":"An old Cherokee man was teaching his grandson about life.\n\n“A fight is going on inside me,” he said. “It is a terrible fight, and it is between two wolves.\n\n“One is anger, envy, sorrow, regret, greed, arrogance, self-pity, guilt, resentment, inferiority, lies, false pride, superiority and ego.\n\n“The other is joy, peace, love, hope, serenity, humility, kindness, benevolence, empathy, generosity, truth, compassion and faith.\n\n“The same fight is going on inside you. And inside every other person, too.”\n\nThe grandson thought about it for a while, and then asked: “Which wolf will win?”\n\nThe old man answered simply.\n\n“The one you feed.”","m":"You will feed one of them today, in a hundred small choices. Notice which bowl you're filling."},{"t":"The Starfish","s":"A man was walking along a beach at dawn when he saw a figure ahead of him, moving oddly — bending, straightening, bending again.\n\nAs he got closer he saw it was a young woman, and that the tide had gone out and left thousands of starfish stranded on the sand for as far as he could see in both directions. She was picking them up one at a time and throwing them back into the sea.\n\n“What are you doing?” he asked.\n\n“The sun is coming up and the tide is going out,” she said. “If I don't throw them in, they'll die.”\n\nHe looked down the beach. There were miles of it. There must have been tens of thousands.\n\n“But there are too many. You can't possibly make a difference.”\n\nShe bent down, picked up another starfish, and threw it past the breaking waves.\n\n“Made a difference to that one,” she said.","m":"The scale of the problem is not an argument against the next small thing. Throw one starfish today."},{"t":"The Boulder in the Road","s":"A king had a boulder placed in the middle of the main road into his city, and then hid himself nearby to watch.\n\nThe first to come was one of his wealthiest merchants, with a cart. He edged around the boulder with some difficulty, and complained loudly about the state of the roads and the king who let them fall into such disrepair.\n\nThen came a courtier, who went around it and said much the same. Then a company of soldiers, who leaned on their spears and discussed whose responsibility it was, and went around. All day, one after another, people worked their way past the stone. Many of them blamed the king for not keeping the road clear. Not one of them tried to move it.\n\nAt dusk a peasant came along carrying a load of vegetables to market. He set his burden down and looked at the boulder. Then he put his shoulder to it and pushed. It did not move. He found a fallen branch and levered at it. He worked at it for a long time, sweating, until at last he rolled it clear of the road.\n\nWhen he went back to pick up his vegetables, he found a purse lying where the boulder had been. It was full of gold coins and a note from the king, saying that the gold was payment for whoever removed the stone.","m":"Every obstacle carries a purse under it. Most people go around and complain, which is why the purse is still there."},{"t":"The Donkey in the Well","s":"A farmer's donkey fell down a well. The animal cried piteously for hours while the farmer tried to figure out what to do.\n\nFinally he decided the donkey was old, and the well needed covering up anyway, and it wasn't worth the trouble to retrieve him. He invited his neighbors to come and help. They all grabbed shovels and began to shovel dirt into the well.\n\nAt first, the donkey realized what was happening and cried horribly. Then, to everyone's amazement, he quieted down.\n\nA few shovel loads later, the farmer looked down the well and was astonished at what he saw.\n\nWith every shovel of dirt that hit his back, the donkey was doing something remarkable. He would shake it off and take a step up.\n\nAs the farmer's neighbors continued to shovel dirt on top of the animal, he would shake it off and take a step up. Shake it off and step up. Shake it off and step up.\n\nPretty soon, everyone was astonished as the donkey stepped up over the edge of the well and trotted off.","m":"The dirt that's being thrown at you is also a floor, if you keep shaking it off and stepping up."},{"t":"The Chinese Bamboo","s":"You plant the seed of a Moso bamboo, and then you water it.\n\nThe first year, nothing happens. Not a shoot, not a green tip, nothing above the soil at all. You water it and weed around it and fertilize it, and at the end of twelve months the ground looks exactly as it did on the day you planted.\n\nThe second year, the same. Nothing.\n\nThe third year, nothing. The fourth year, nothing. Four years of watering bare earth, of a neighbor asking what exactly you're growing there, of a reasonable person concluding that the seed was dead and the effort has been wasted. Anyone would stop. Most people do.\n\nIn the fifth year, the bamboo breaks the surface — and grows something like eighty feet in six weeks.\n\nThe question people ask is whether it grew eighty feet in six weeks or in five years, and the answer is not really a riddle. All through those silent years it was building a root system, deep and wide enough to support the height that was coming. Without the roots, the stalk would have gone up a few feet and fallen over.\n\nThe growth was never absent. It was underground, which is not the same thing.","m":"Some work has no visible output for a long time and is still working. Water it today anyway."},{"t":"The Elephant and the Rope","s":"A man walking past a group of working elephants stopped, puzzled by something.\n\nThe animals were being held by nothing more than a thin rope tied to one front leg, staked into the ground. No chains, no cages. Any one of them could have snapped the rope like thread at any moment, and none of them were trying.\n\nHe found a trainer and asked why.\n\n“When they are very young and much smaller,” the trainer said, “we use a rope of that same size to tie them. At that age, it's enough to hold them. They pull against it and they can't get free. They grow up believing they cannot break the rope.\n\n“So they never try again. The rope stays the same and they get to be three tons, and they still believe it holds them.”\n\nThe man walked away astonished. These enormous animals could have broken free from their bonds at any moment, and because they believed they couldn't, they were stuck exactly where they were.","m":"Check the rope. Some of what's holding you was only ever strong enough to hold a much smaller version of you."},{"t":"The Glass of Water","s":"A psychologist walked around a room while teaching stress management to an audience. As she raised a glass of water, everyone expected they'd be asked the half empty or half full question. Instead, with a smile on her face, she asked: “How heavy is this glass of water?”\n\nAnswers called out ranged from eight ounces to twenty.\n\n“The absolute weight doesn't matter,” she replied. “It depends on how long I hold it. If I hold it for a minute, it's not a problem. If I hold it for an hour, I'll have an ache in my arm. If I hold it for a day, my arm will feel numb and paralysed. In each case the weight of the glass doesn't change, but the longer I hold it, the heavier it becomes.”\n\nShe set the glass down.\n\n“The stresses and worries in life are like that glass of water. Think about them for a while and nothing happens. Think about them a bit longer and they begin to hurt. And if you think about them all day long, you will feel paralysed — incapable of doing anything.\n\n“It's important to remember to let go of your stresses. As early in the evening as you can, put all your burdens down. Don't carry them through the night and into the next day. Whatever burdens you're carrying now — set them down for a moment if you can.”","m":"The weight isn't the problem. The duration is. Put it down before tonight."},{"t":"The Three Bricklayers","s":"In 1666, after the Great Fire, Sir Christopher Wren was surveying the site where St Paul's Cathedral would be rebuilt. He came upon three bricklayers on a scaffold, all doing exactly the same work, and asked each of them what he was doing.\n\nThe first man, working quickly and not looking up, said: “I'm a bricklayer. I'm working hard laying bricks to feed my family.”\n\nThe second, working steadily, said: “I'm a builder. I'm building a wall.”\n\nThe third looked up, and his eyes were bright, and he said: “I'm a cathedral builder. I'm building a great cathedral to the Almighty.”\n\nThe motions of their hands were identical. The bricks were the same bricks.\n\nThe story is often told with an ending: that the first man stayed a bricklayer his whole life, the second became a foreman, and the third eventually became an architect. Whether or not that part is true, the useful piece is the middle. Three men, one wall, three entirely different days.","m":"You can't always change today's bricks. You can change what you understand yourself to be building."},{"t":"The Long Spoons","s":"A man was granted a vision of the afterlife, and was shown hell first.\n\nHe saw a great round table with an enormous pot of stew at the center, and the smell of it was extraordinary. Around the table sat people who were starving — gaunt, desperate, hollow-eyed. Each of them held a spoon that reached the pot, but the handle was far longer than their own arm, so that having filled the spoon they could not get it back to their mouths.\n\nThey strained and twisted and dropped stew on the floor and screamed at each other, and they starved with the food in front of them.\n\nThen he was shown heaven.\n\nIt was the same round table. The same pot of stew, the same smell. The same spoons, precisely as long, precisely as awkward.\n\nBut here the people were well fed, and talking, and laughing.\n\n“I don't understand,” the man said. “It's identical. Why are they happy here and starving there?”\n\n“It's simple,” said his guide. “Here they have learned to feed each other.”","m":"The constraint is the same in both rooms. What differs is whether anyone thought to turn toward the person beside them."},{"t":"The Fence and the Nails","s":"There was a boy with a bad temper. His father gave him a bag of nails and told him that every time he lost his temper, he was to hammer a nail into the back fence.\n\nThe first day, the boy drove thirty-seven nails into the fence.\n\nOver the next few weeks, as he learned to control his anger, the number of nails hammered daily gradually dwindled. He discovered it was easier to hold his temper than to drive those nails into the fence.\n\nFinally the day came when the boy didn't lose his temper at all. He told his father about it, and the father suggested that the boy now pull out one nail for each day that he was able to hold his temper.\n\nThe days passed, and the young boy was finally able to tell his father that all the nails were gone.\n\nThe father took his son by the hand and led him to the fence.\n\n“You have done well, my son,” he said. “But look at the holes in the fence. The fence will never be the same. When you say things in anger, they leave a scar just like this one. You can put a knife in a man and draw it out. It won't matter how many times you say I'm sorry — the wound is still there.”","m":"Apologies pull the nail out. They don't fill the hole. Be careful today with the people who'll still be there tomorrow."},{"t":"The Emperor's Seeds","s":"An ageing emperor with no children needed a successor, and rather than choose a noble or a minister, he called all the young people of the kingdom to the palace.\n\n“I am going to give each one of you a seed today. One very special seed. I want you to go home, plant the seed, water it, and come back here one year from today with what you have grown. I will then judge the plants that you bring, and the one I choose will be the next emperor.”\n\nA boy named Ling was among them. He went home, and with his mother's help he found a pot and soil and planted his seed carefully, and he watered it every day.\n\nAfter three weeks, the other young people were talking about their seeds and the plants that had begun to grow. Ling kept checking his, and nothing came up.\n\nThree weeks became six, and then a season, and then most of a year. Everyone else spoke of trees and tall flowers and beautiful bushes. Ling had a pot of dirt. He said nothing to them, but he kept watering it.\n\nA year passed. All the young people brought their plants to the palace for inspection. Ling did not want to go at all. His mother told him to take the pot and be honest about what had happened.\n\nWhen he arrived, carrying his empty pot, the other young people were astonished by the array of plants — every kind of tree and flower. They laughed at him. A few felt sorry for him.\n\nThe emperor came in and surveyed the hall, and then he saw Ling at the back with his empty pot, and ordered his guards to bring him to the front. Ling was terrified.\n\n“My name is Ling,” he said. “I planted the seed you gave me and I watered it every day, and it never grew.”\n\nThe emperor turned to the hall.\n\n“One year ago today, I gave everyone here a seed. I gave you all a boiled seed. They were dead — none of them could grow. All of you, except Ling, have brought me trees and plants and flowers. When you found that your seed would not grow, you substituted another seed for the one I gave you. Ling was the only one with the courage and honesty to bring me a pot with my seed in it. Therefore, he is the one who will be the new emperor.”","m":"Bring the empty pot. The one thing that can't be faked is being the person who tells you the truth about the outcome."},{"t":"The Violinist in the Metro","s":"On a cold Friday morning in January 2007, a man in jeans and a baseball cap set up in the L'Enfant Plaza metro station in Washington, opened a violin case at his feet, threw in a few dollars as seed money, and began to play.\n\nHe played for forty-three minutes. Six pieces, mostly Bach, including the Chaconne from the Partita in D minor, which is among the most demanding works ever written for the instrument.\n\nDuring that time, 1,097 people passed him.\n\nSeven stopped to listen for at least a minute. Twenty-seven gave money. He collected $32.17. The overwhelming majority walked past without slowing, checking phones, making their trains. One woman recognized him and stood watching, astonished.\n\nThe violinist was Joshua Bell, one of the finest musicians alive. He was playing a Stradivarius made in 1713, worth about three and a half million dollars. Three days earlier he had filled Boston's Symphony Hall, where decent seats went for a hundred dollars.\n\nThe Washington Post had arranged it as an experiment, and won a Pulitzer for the piece. One detail stayed with almost everyone who read it: nearly every time a small child walked past, the child tried to stop and look, and every single time, the parent hurried them along.","m":"Extraordinary things are going past you in unmarked clothes. Some of what you'd pay a hundred dollars for is free at 8am and you're late."},{"t":"The Tortoise and the Hare","s":"A hare who had never lost a race mocked a tortoise for the way he walked. The tortoise, tired of it, offered a race. The hare laughed so hard he nearly fell over, and agreed.\n\nAt the start the hare was gone in a blur. Halfway along he looked back and saw nothing but empty road. The sun was warm. He had time, more time than he could possibly need. He lay down under a tree, just to make the point.\n\nThe tortoise did not look at the hare, or the tree, or the distance left. He looked at the next step, and then the one after that. He passed the tree without a sound.\n\nThe hare woke to cheering in the distance. He ran harder than he had ever run, and arrived in time to see the tortoise cross the line.\n\nThe hare was faster on every single day of his life, including that one.","m":"Talent decides how fast you can go. Consistency decides how far you get. Take the next step and let the fast ones nap."},{"t":"The Boy Who Cried Wolf","s":"A boy was given the dull job of watching the village sheep. One slow afternoon he ran toward the village shouting, “Wolf! Wolf!” Everyone dropped their work and came running with sticks and pitchforks. There was no wolf. The boy laughed until his sides hurt.\n\nA week later he did it again. They came again, a little slower, and went home a little angrier.\n\nThen one evening a real wolf came down from the hills. The boy screamed with everything he had. In the village, people heard him clearly. One man shook his head. Another went on mending his fence. Nobody came.\n\nThe villagers were not cruel. They had simply learned what his voice was worth, and he was the one who had taught them.","m":"Every word you say sets the price of the next one. Keep your word in small things so it still works when you need it."},{"t":"The Fox and the Grapes","s":"A hungry fox came upon a vine heavy with ripe grapes, hanging just above his reach. He jumped and missed. He backed up, took a run, and missed again. He tried from the left, from the right, from a rock. Each time his teeth closed on air.\n\nAt last he sat down, out of breath, and looked up at them for a long moment.\n\n“They're sour anyway,” he said, loudly enough for the birds to hear, and he trotted off with his nose in the air.\n\nHe was still hungry. Now he was also a little less honest than he had been that morning, and the only one he had fooled was himself.","m":"When you can't reach something, say “I couldn't reach it.” Calling it worthless feels better for a minute and costs you the truth."},{"t":"The Dog and His Reflection","s":"A dog was trotting home with a fine piece of meat in his mouth, very pleased with his day. His path crossed a narrow bridge over a still stream. Glancing down, he saw another dog looking up at him, and that dog was carrying a piece of meat too. It looked bigger.\n\nHe stopped. He stared. The other dog stared back, and did not offer to share.\n\nHe wanted both. He snapped at the other dog's meat, and the moment his jaws opened, his own dinner dropped into the water and sank out of sight. The other dog's vanished with it.\n\nHe stood on the bridge a long time, looking at a stream with nothing in it.","m":"Wanting more is fine. Just notice when reaching for it means letting go of what you already hold."},{"t":"The Oak and the Reed","s":"A great oak stood on a riverbank and pitied the reeds below it. “Every breeze pushes you around,” it said. “I have stood against a hundred storms and never bowed once.”\n\n“We bend,” said a reed. “It isn't glamorous.”\n\nThat night a storm came that was worse than the other hundred. The reeds lay flat against the water and let the wind go over them. The oak did what it had always done. It held, and held, and held, and then, with a sound like a cannon, it didn't.\n\nIn the morning the reeds straightened up, one by one, around the fallen trunk.","m":"Strength that cannot bend has a breaking point. Hold your values firmly and your plans loosely."},{"t":"The Miller, His Son and the Donkey","s":"A miller and his son were walking their donkey to market. They passed some women at a well. “Look at those fools,” one said, “walking when they could ride.” So the miller put his son on the donkey.\n\nNext they passed some old men. “Lazy boy, riding while his father walks.” So they traded places.\n\nNext, a group of mothers. “That poor child, trotting behind while the man rides.” So they both climbed on.\n\nNear town, a farmer scowled. “Two of you on that small animal? You should be carrying him.” Red-faced, they tied the donkey's legs to a pole and carried him across the bridge, while the whole market roared with laughter. The donkey kicked loose, fell in the river, and was gone.\n\n“Son,” said the miller, “we tried to please everyone. We pleased no one and lost the donkey.”","m":"Someone will disapprove of every option. Decide by what's right for where you're going, then let them talk."},{"t":"King Canute and the Tide","s":"King Canute ruled England, Denmark and Norway, and his courtiers never let him forget it. “Nothing would dare disobey you,” they told him daily. “The sea itself would obey.”\n\nHe grew tired of it. One day he had his throne carried down to the shore at low tide and set on the wet sand. The courtiers followed, nervous.\n\n“Sea,” the king commanded, “you are in my kingdom. I order you not to rise and not to wet my feet.”\n\nThe tide came in exactly as it always had. It wet his shoes, then his robe, then the legs of the throne.\n\nThe king stood up in the water and turned to his court. “Now you see what a king's power is worth,” he said. He is said to have never worn his crown again.","m":"Know the line between what you command and what you don't. Flattery will happily erase it for you."},{"t":"Cincinnatus","s":"In the early days of Rome, an army was trapped by its enemies and the city was in panic. The Senate sent messengers to a small farm across the river, where a retired statesman named Cincinnatus was plowing his own field.\n\nThey told him he had been made dictator, with complete power over Rome for six months. He wiped off the dirt, said goodbye to his wife, and went.\n\nHe raised an army, marched, surrounded the enemy and won. The whole thing took about fifteen days. He had five and a half months of absolute power left, and nobody could have taken it from him.\n\nHe resigned and went back to his plow.\n\nCenturies later, Americans watched George Washington give up command and go home to his farm, and they called him by the same name.","m":"Take up the job when you're needed and put it down when it's done. The power was never the point."},{"t":"The Butterfly","s":"A man found a cocoon on a branch and brought it home to watch. One morning a small opening appeared, and for hours the butterfly inside fought to squeeze its body through. Then it seemed to stop, as if it had gone as far as it could.\n\nThe man felt sorry for it. He took a pair of scissors and carefully snipped the rest of the cocoon open. The butterfly slid out easily.\n\nIts body was swollen and its wings were small and crumpled. He waited for the wings to open and spread. They never did. It spent its short life crawling.\n\nWhat he hadn't understood was that the tight opening was doing a job. The struggle to get through it is what forces fluid out of the body and into the wings.","m":"Some struggles are doing a job. Before you rescue someone, or wish your own hard thing away, ask what it's building."},{"t":"The Carrot, the Egg and the Coffee","s":"A young woman told her grandmother that life was too hard and she was tired of fighting. The grandmother said nothing. She filled three pots with water and set them to boil. In the first she put a carrot, in the second an egg, in the third a handful of ground coffee.\n\nAfter twenty minutes she set them out. “Tell me what you see.”\n\n“A carrot, an egg and coffee.”\n\n“Feel them.” The carrot, which had gone in hard, was soft. The egg, which had gone in fragile, was hard all the way through. The coffee was different. It had changed the water.\n\n“They all met the same boiling water,” her grandmother said. “One went soft. One went hard. One made something good out of it. When trouble comes, which are you?”","m":"The heat is the same for everyone. You can go soft, go hard, or change what's around you."},{"t":"The Wise Woman's Stone","s":"A wise woman traveling in the mountains found a precious stone in a stream and put it in her bag. The next day she met a hungry traveler and opened the bag to share her food. He saw the stone and, half joking, asked if he could have it.\n\nShe handed it to him without a pause.\n\nHe left quickly, amazed at his luck. The stone was worth enough to keep him comfortable for the rest of his life.\n\nA few days later he came back, found her, and put the stone in her hand.\n\n“I've been thinking,” he said. “I know what this is worth. I'm returning it, hoping you can give me something more valuable. Give me whatever it is inside you that let you give it away.”","m":"What you own matters less than how tightly you have to grip it. The freedom is worth more than the stone."},{"t":"The Two Pebbles","s":"A merchant owed a great debt to a moneylender, who offered a deal. He would put one black pebble and one white pebble in a bag, and the merchant's daughter would draw one. White, and the debt was forgiven. Black, and she would have to marry him. Refuse, and her father went to jail.\n\nThey stood on a pebbled path. As the moneylender bent to pick two stones, the daughter saw him slip two black ones into the bag.\n\nShe could refuse and send her father to jail. She could expose him and be called a liar. She could draw a black pebble and accept it.\n\nShe reached in, drew a pebble, and fumbled it. It fell among all the others on the path.\n\n“How clumsy of me,” she said. “But it's no trouble. Look in the bag. Whichever color is left, I must have drawn the other.”","m":"When every option on the table is bad, look for the one that isn't on the table yet."},{"t":"The Archer on the Cliff","s":"A young archer had won every contest in his province, and he challenged an old master known for his skill. The young man went first. He hit a distant bull's-eye, then split his own arrow with a second shot. “Match that,” he said.\n\nThe old man didn't draw his bow. He motioned for the young man to follow him up the mountain, to a deep gorge crossed by a single shaky log. The master walked to the middle of the log, picked a tree far across the gorge, and put an arrow cleanly in its trunk.\n\n“Your turn,” he said, stepping back onto solid ground.\n\nThe young man looked at the log and the drop beneath it. He could not make himself step out, let alone shoot.\n\n“You have great skill with the bow,” the master said, “and little yet with the mind that lets go of the arrow.”","m":"Skill in calm conditions is half the craft. Train the steadiness too, because the shots that matter rarely come on flat ground."},{"t":"The Golden Repair","s":"In Japan, the story goes, a shogun broke his favorite tea bowl and sent it away to be mended. It came back held together with ugly metal staples. It worked, but he could hardly look at it.\n\nHe asked his own craftsmen to do better. They couldn't hide the cracks; a bowl broken that badly can't be made to look new. So they stopped trying. They filled the breaks with lacquer mixed with powdered gold.\n\nThe bowl came back with bright veins running through it, each one tracing exactly where it had come apart. The shogun thought it more beautiful than before it broke.\n\nThe craft is called kintsugi, golden joinery, and it is still practiced. The repaired piece is not valued in spite of its damage. The repair is part of what it's worth.","m":"You don't have to hide where you've been broken. Mend it well and it becomes part of what makes you worth something."},{"t":"Hercules and the Wagoner","s":"A farmer was driving a loaded wagon down a muddy road when the wheels sank to the axles. The horses strained and the wagon didn't move.\n\nThe farmer climbed down, looked at the mud, and did the only thing he could think of. He dropped to his knees and prayed loudly to Hercules, the strongest of the gods, to come and lift the wagon out.\n\nTo his surprise, Hercules appeared. He looked at the wagon, and then at the farmer kneeling in the road with clean hands.\n\n“Get up,” Hercules said. “Put your shoulder to the wheel and urge your horses on. Do you think a wagon moves because you stare at it and complain? I help the ones who are already pushing.”\n\nThe farmer put his shoulder to the wheel. It was a long time before the wagon moved, and it did.","m":"Ask for help, and be pushing when it arrives. Most help shows up for people already in motion."},{"t":"A Thousand Marbles","s":"A man in his fifties sat down one day and did some arithmetic. The average person lives about seventy-five years. He multiplied by fifty-two and came out with roughly 3,900 Saturdays in a lifetime. Then he subtracted the ones he had already used.\n\nHe had about a thousand left.\n\nSo he went to three toy stores and bought a thousand marbles, and put them in a big clear jar next to his radio. Every Saturday morning he took one marble out and threw it away.\n\n“Watching the marbles go down,” he told a friend, “did more to get my priorities straight than anything anyone ever said to me.”\n\nYears later, on the morning he took out the last marble, he took his wife to breakfast. “I figure if I make it to next Saturday,” he said, “I've been given a little extra time.”","m":"Your days are a number, and you can't see the jar. Spend today on something you'd be glad you traded a marble for."}];

rrot?","a":"A carrot."},{"q":"Why was six afraid of seven?","a":"It wasn't. Numbers can't feel fear."},{"q":"A man walks into a bar.","a":"He orders a drink, pays for it and leaves. He was thirsty."},{"q":"Knock knock. Who's there? Interrupting cow. Interrupting c—","a":"MOO."},{"a":"Nothing makes you feel more like an adult than being excited about a new sponge."},{"a":"My back goes out more than I do."},{"a":"My email inbox is a to-do list that other people write for me."},{"a":"The fastest way to find something you've lost is to buy a replacement."},{"a":"Nothing ruins a Friday like realizing it's Tuesday."},{"a":"I got a week's worth of cardio walking into a spider web."},{"a":"Adulthood is mostly saying \"after this week it'll calm down\" until you die."},{"a":"I know the name of the woman who delivers my packages, but not my neighbor's."},{"a":"I tried to become a morning person once. It didn't take."},{"a":"The only running I do is running late."},{"a":"My pillow gives me a new hairstyle every morning, free of charge."},{"a":"Being an adult is just googling how to do stuff."},{"a":"I love a meeting that could have been an email. Said nobody, ever."},{"a":"I used to do drugs. I still do, but I used to, too."},{"a":"I haven't slept for ten days, because that would be too long."},{"a":"My fake plants died because I did not pretend to water them."},{"a":"I like rice. Rice is great when you're hungry and you want two thousand of something."},{"a":"An escalator can never break. It can only become stairs."},{"a":"I'm sick of following my dreams. I'm just going to ask them where they're going and hook up with them later."},{"a":"I intend to live forever. So far, so good."},{"a":"Borrow money from pessimists — they don't expect it back."},{"a":"I'm having amnesia and déjà vu at the same time. I think I've forgotten this before."},{"a":"Everywhere is within walking distance if you have the time."},{"a":"I put instant coffee in a microwave and almost went back in time."},{"a":"The worst time to have a heart attack is during a game of charades."},{"a":"Employee of the month is a good example of how someone can be a winner and a loser at the same time."},{"a":"I told my dentist my teeth are going yellow. He told me to wear a brown tie."},{"a":"I looked up my family tree and found out I was the sap."},{"a":"I told the doctor I broke my arm in two places. He told me to stop going to those places."},{"a":"I went to the doctor and said, \"It hurts when I do this.\" He said, \"Well, don't do that.\""},{"a":"I never forget a face, but in your case I'll be glad to make an exception."},{"a":"Outside of a dog, a book is a man's best friend. Inside of a dog it's too dark to read."},{"a":"This is not a novel to be tossed aside lightly. It should be thrown with great force."},{"a":"Some cause happiness wherever they go; others whenever they go."},{"a":"I love deadlines. I love the whooshing noise they make as they go by."},{"a":"The trouble with having an open mind is that people keep coming along and sticking things in it."},{"a":"Weather forecast for tonight: dark."},{"a":"I love being married. It's so great to find that one special person you want to annoy for the rest of your life."},{"a":"Best way to get rid of kitchen odours: eat out."},{"a":"Cleaning your house while your kids are still growing is like shoveling the walk before it stops snowing."},{"a":"Never go to a doctor whose office plants have died."},{"a":"I always wanted to be somebody, but now I realize I should have been more specific."},{"a":"I used to think the brain was the most wonderful organ in my body. Then I realized who was telling me this."},{"a":"As a kid I was made to walk the plank. We couldn't afford a dog."},{"a":"I was going to buy a book on phobias, but I was afraid it wouldn't help me."},{"a":"Velcro. What a rip-off."},{"a":"Exit signs. They're on the way out."},{"a":"If you ever drop your keys into a river of molten lava, let 'em go, because man, they're gone."},{"a":"Before you criticize someone, walk a mile in their shoes. That way, when you criticize them, you're a mile away and you have their shoes."},{"a":"I hope life isn't a big joke, because I don't get it."},{"a":"I'm not superstitious. I'm just a little stitious."},{"a":"I have a lot of growing up to do. I realized that the other day inside my fort."},{"q":"What did one wall say to the other?","a":"I'll meet you at the corner."},{"q":"Why couldn't the leopard play hide and seek?","a":"He was always spotted."},{"q":"What do you call a sleeping bull?","a":"A bulldozer."},{"q":"Why did the golfer bring two pairs of pants?","a":"In case he got a hole in one."},{"q":"How do you make a tissue dance?","a":"Put a little boogie in it."},{"q":"What do you call a pile of cats?","a":"A meowtain."},{"q":"Why are elevator jokes so good?","a":"They work on many levels."},{"q":"Why can't you trust stairs?","a":"They're always up to something."},{"q":"What do you call a dinosaur with a great vocabulary?","a":"A thesaurus."},{"q":"Why did the tomato blush?","a":"It saw the salad dressing."},{"q":"How do you catch a squirrel?","a":"Climb a tree and act like a nut."},{"q":"What do lawyers wear to court?","a":"Lawsuits."},{"q":"Why did the invisible man turn down the job?","a":"He couldn't see himself doing it."},{"q":"What kind of shoes do ninjas wear?","a":"Sneakers."},{"q":"What did the zero say to the eight?","a":"Nice belt."},{"q":"Why don't oysters donate to charity?","a":"They're shellfish."},{"q":"Why was the broom late?","a":"It overswept."},{"q":"What's a skeleton's least favorite room?","a":"The living room."},{"a":"I told my wife she was drawing her eyebrows too high. She looked surprised."},{"a":"I have a fear of speed bumps, but I'm slowly getting over it."},{"a":"My boss told me to have a good day, so I went home."},{"a":"I don't trust atoms. They make up everything."},{"a":"I wanted to be a doctor, but I didn't have the patience."},{"a":"I'd tell you a construction joke, but I'm still working on it."},{"a":"I was wondering why the ball kept getting bigger. Then it hit me."},{"a":"Parallel lines have so much in common. It's a shame they'll never meet."},{"a":"I got a job at a bakery because I kneaded dough."},{"a":"My wife said I should do lunges to stay in shape. That would be a big step forward."},{"a":"I used to play piano by ear. Now I use my hands."},{"a":"Never criticize someone until you've walked a mile in their shoes. That way you're a mile away and you have their shoes."},{"a":"I asked the librarian if the library had books on paranoia. She whispered, “They're right behind you.”"},{"a":"My memory has gotten so bad it actually got me fired. I still can't remember why I'm telling you this."},{"a":"I have an inferiority complex, but it's not a very good one."},{"a":"Light travels faster than sound. That's why some people appear bright until they speak."},{"a":"I decided to sell my vacuum cleaner. It was just gathering dust."},{"a":"The early bird gets the worm, but the second mouse gets the cheese."},{"a":"I'm reading a book on the history of glue. I can't put it down."},{"a":"Dear Math, please grow up and solve your own problems."},{"a":"I told my kids I'd take them to the zoo. If the zoo wants them, it can come and get them."},{"a":"A clear conscience is usually the sign of a bad memory."},{"a":"My therapist says I have a preoccupation with revenge. We'll see about that."}];
const STARTER_LESSONS=[["Presence","Put the phone down. Whoever is in front of you is the point."],["First things","Do the hard thing first, while it's still quiet."],["Pace","Slow is smooth, and smooth is fast."],["Benefit of the doubt","Assume the best intention first. You're usually right, and always calmer."],["Body","Move before you think. The body votes first."],["Listening","Ask one real question and then be quiet."],["Heat","Sleep on anything you wanted to reply to immediately."],["Two minutes","If it takes two minutes, do it now. Stop moving it down the list."],["Finish","One finished thing beats five started ones."],["Purpose","Know why you're doing this. The what gets easier after that."]];
const MEDS=[{"t":"Breath","d":"Rest attention on breathing.","c":["Sit comfortably. Let your eyes close or rest on one spot.","Take one slow, deep breath, and let it go.","Now let the breath be natural. You don't need to control it.","Find where you feel it most clearly: the nose, the chest or the belly.","Feel one whole breath, from the start of the in-breath to the end of the out-breath.","When you notice you've been thinking, that noticing is the practice. Gently come back.","There is nowhere to get to. Just this breath.","If the mind wandered again, start again. Starting again is the whole skill.","Let go of the breath now and simply sit for a moment.","Notice how you feel. Carry that with you."]},{"t":"Body scan","d":"Move attention slowly through the body.","c":["Sit or lie comfortably and let your body be heavy.","Bring attention to the top of your head and your forehead. Let them soften.","Relax your jaw. Let your tongue rest. Let your shoulders drop.","Feel your arms and hands. Notice warmth, tingling or pressure.","Feel your chest and belly move as you breathe.","Notice your back against the chair, and the weight of your body being held up.","Move attention down through your hips, your legs, your feet.","Now feel the whole body at once, sitting and breathing.","If you find tension anywhere, breathe into it and let it be.","Slowly move your fingers and toes. Open your eyes when you're ready."]},{"t":"Sounds","d":"Use hearing as the anchor.","c":["Settle in and close your eyes.","Instead of the breath, pay attention to sound.","Notice the farthest sound you can hear.","Now notice the closest one.","You don't need to name sounds or like them. Just let them arrive.","Notice the silence between sounds, and that sounds appear in it on their own.","When thoughts pull you away, treat them like one more sound, and listen again.","Notice that hearing takes no effort at all.","Rest as the one who is listening.","Let the sounds fade into the background, and open your eyes."]},{"t":"Counting","d":"Count breaths to steady a busy mind.","c":["Sit comfortably. Take one deep breath and let it go.","Count each out-breath silently: one, then two, up to ten.","If you lose count, no problem. Start again at one.","Keep the counting soft, in the background. Most of your attention stays on the feeling of the breath.","At ten, start over at one.","Notice how often the mind wanders. That is normal. Come back to one.","Let each out-breath be a little longer than the in-breath.","Keep counting, lightly.","Now drop the counting and just breathe.","Notice that your mind is a little quieter than when you sat down."]},{"t":"Open awareness","d":"Let everything come and go.","c":["Sit comfortably with your eyes closed or half open.","Take a few breaths to arrive.","Now don't focus on anything in particular. Just be aware.","Sounds, sensations, thoughts: let each one appear and pass on its own.","You're like the sky, and everything else is weather moving through it.","When you get caught in a thought, notice that you were caught, and rest back.","Notice that awareness itself isn't bothered by what appears in it.","There is nothing to fix for these few minutes.","Rest here.","Take that open feeling with you into what comes next."]},{"t":"Gratitude","d":"Bring to mind what is going right.","c":["Sit comfortably and take a slow breath.","Bring to mind one person you're glad is in your life. Picture their face.","Think of one specific thing they did that you appreciated.","Now think of something your body let you do today or yesterday.","Think of one ordinary comfort you'd miss if it were gone: hot water, a bed, a meal.","Think of something difficult that taught you something useful.","Notice how your chest and face feel when you dwell on these.","Pick one of these to say out loud to someone today.","Breathe in. Breathe out.","Open your eyes."]},{"t":"Noting","d":"Label what the mind is doing.","c":["Sit comfortably and let the breath settle.","Each time something pulls your attention, give it a quiet one-word label.","A thought about later: “planning.” A replay of earlier: “remembering.”","A sound: “hearing.” An itch or ache: “feeling.”","Label it once, gently, and return to the breath.","You're not pushing anything away. You're just seeing what's there.","Notice which label comes up most. That's where your mind lives today.","Keep noting, lightly.","Now stop labeling and just sit.","You know your own mind a little better than you did five minutes ago."]},{"t":"Kindness","d":"Wish yourself and others well.","c":["Sit comfortably and take a slow breath.","Silently say to yourself: may I be well. May I be at ease.","It may feel awkward. Say it again anyway and mean it as much as you can.","Bring to mind someone you love. May you be well. May you be at ease.","Bring to mind someone neutral, a face you passed this week. May you be well.","Bring to mind someone you find difficult. Just a little: may you be well.","Now widen it to everyone in your home, your street, your town.","May all of us be well. May all of us be at ease.","Rest in that for a few breaths.","Open your eyes and bring it with you."]}];

/* ---------- state ---------- */
const KEY='calibrate6';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function fresh(){return{v:1,dayStart:4,big:0,voice:0,medMin:5,q:{},qn:{},last:{},lp:-1,lessons:null,tasks:[],saved:[],hist:{},day:null,g:{},gdel:[],exportAt:0,first:Date.now()}}
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!s||typeof s!=='object'||s.v!==1)s=fresh();
 const f=fresh();for(const k in f)if(s[k]==null&&f[k]!=null)s[k]=f[k];
 if(!Array.isArray(s.lessons))s.lessons=seedLessons();
 if(!Array.isArray(s.tasks))s.tasks=[];
 return s}
function seedLessons(){ // carry over reminders from the earlier version of the app, if any
 try{const o=JSON.parse(localStorage.getItem('flSettings'));if(o&&Array.isArray(o.affirms)&&o.affirms.length)
  return o.affirms.map(a=>{const k=String(a).indexOf('|');return{id:uid(),t:k>0?String(a).slice(0,k).trim():'',x:k>0?String(a).slice(k+1).trim():String(a).trim()}}).filter(l=>l.x)}catch(e){}
 return STARTER_LESSONS.map(a=>({id:uid(),t:a[0],x:a[1]}))}
let S=load(),saveWarned=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!saveWarned){saveWarned=true;toast('Storage is full. Export a backup in Settings.')}}}
const pad=n=>String(n).padStart(2,'0');
const dk=t=>{const d=new Date(t-S.dayStart*3600e3);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dayKey=()=>dk(Date.now());
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(type){const n=DATA[type].length;let q=S.q[type];
 if(Array.isArray(q)&&S.qn[type]&&S.qn[type]<n){const add=[];for(let i=S.qn[type];i<n;i++)add.push(i);q=shuffle(q.concat(add))} // new material arrived in an update
 if(!Array.isArray(q)||!q.length){q=shuffle([...Array(n).keys()]);if(n>1&&q[q.length-1]===S.last[type])q.unshift(q.pop())}
 q=q.filter(i=>i<n);const i=q.length?q.pop():0;S.q[type]=q;S.qn[type]=n;S.last[type]=i;return i}
function drawLesson(){if(!S.lessons.length)return null;S.lp=(S.lp+1)%S.lessons.length;return S.lessons[S.lp].id}
function ensureDay(){const k=dayKey();if(S.day&&S.day.k===k)return;
 const prev=S.day;S.day={k,pick:{},done:{},yw:prev&&prev.pick&&prev.pick.word!=null?prev.pick.word:null};
 S.tasks=S.tasks.filter(t=>!t.done||t.dirty||dk(t.doneAt||0)===k);S.tasks.forEach(t=>{t.star=0});save()}
function pick(type){ensureDay();const p=S.day.pick;if(p[type]==null||(type==='lesson'&&!S.lessons.find(l=>l.id===p[type]))){p[type]=type==='lesson'?drawLesson():draw(type);save()}return p[type]}
const doneCount=()=>CARDS.filter(c=>S.day.done[c.id]).length;

/* ---------- router ---------- */
let route='',EDIT=null,LEDIT=null,REVEAL=false,M=null,gState='';
function arrive(){EDIT=LEDIT=null;REVEAL=false;stopMed(true);render(true)}
function go(h,rep){h=h||'';if(h===location.hash.slice(1)){render();return}rep?location.replace('#'+h):location.hash=h;arrive()}
addEventListener('hashchange',()=>{if(location.hash.slice(1)!==route)arrive()});
function render(top){ensureDay();route=location.hash.slice(1);const v=$('#view');const keep=top?0:v.scrollTop;
 const [a,b]=route.split('/');let html;
 if(a==='deck'){const n=Math.max(0,Math.min(CARDS.length-1,+b||0));html=vDeck(n)}
 else if(a==='done')html=vDone();else if(a==='list')html=vList();else if(a==='lessons')html=vLessons();
 else if(a==='saved')html=vSaved();else if(a==='settings')html=vSettings();else if(a==='gsetup')html=vGsetup();
 else html=vHome();
 v.innerHTML=html;v.scrollTop=keep;
 const deep=a==='deck'||a==='done'||a==='gsetup';
 const T=$('#tabs');T.classList.toggle('hide',deep);
 T.innerHTML=[['','Today','sun'],['list','List','list'],['lessons','Lessons','lesson'],['saved','Saved','heart']].map(t=>`<button data-go="${t[0]}" class="${(a||'')===t[0]?'on':''}" ${(a||'')===t[0]?'aria-current="page"':''}>${ic(t[2])}${t[1]}</button>`).join('');
 if(a==='list'||(a==='deck'&&CARDS[+b||0].id==='list'))gSync()}

/* ---------- views ---------- */
function hdr(title){return `<div class="hdr"><span class="brand">${title||'Calibrate'}</span><button class="ib" data-go="settings" aria-label="Settings">${ic('gear')}</button></div>`}
function vHome(){const n=doneCount(),tot=CARDS.length,next=CARDS.findIndex(c=>!S.day.done[c.id]);
 const h=new Date().getHours(),hi=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
 const C=2*Math.PI*32,off=C*(1-n/tot);
 const btn=n===0?'Start':n<tot?'Continue':'Go again';
 const msg=n===0?'A few minutes to point the day.':n<tot?`Next up: ${CARDS[next].name}.`:'You are calibrated for today.';
 const focus=S.tasks.filter(t=>t.star&&!t.done),open=S.tasks.filter(t=>!t.done);
 const show=focus.length?focus:sorted(open).slice(0,3);
 const wk=[];for(let i=6;i>=0;i--){const t=Date.now()-i*864e5,k=dk(t);wk.push(`<span><i class="${S.hist[k]?'on':''} ${i===0?'now':''}"></i>${'SMTWTFS'[new Date(t-S.dayStart*3600e3).getDay()]}</span>`)}
 return hdr()+`<div class="panel"><h1 class="hello">${hi}</h1><div class="date">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>
 <div class="hero"><div class="ring"><svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="32" fill="none" stroke="rgba(20,40,58,.12)" stroke-width="7"/><circle cx="38" cy="38" r="32" fill="none" stroke="${n===tot?'#1f8a5b':'#1c5fae'}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><b>${n}/${tot}</b></div>
 <div><p>${msg}</p><button class="btn pri" data-go="deck/${next<0?0:next}" id="start">${btn} ${ic('right')}</button></div></div></div>
 <div class="sec">Today's cards</div><div class="panel" style="padding:6px 16px"><ul class="steps">${CARDS.map((c,i)=>`<li><button class="step" data-go="deck/${i}" style="--c:${c.col}"><span class="dot">${ic(c.id)}</span><span><span class="nm">${c.name}</span><br><span class="ds">${c.ds}</span></span><span class="st ${S.day.done[c.id]===1?'ok':''}">${S.day.done[c.id]===1?ic('check'):ic('right')}</span></button></li>`).join('')}</ul></div>
 <div class="sec"><span>${focus.length?"Today's focus":'On your list'}</span><button class="link" data-go="list">Open list</button></div>
 <div class="panel" style="padding:6px 12px">${show.length?`<ul class="tasks">${show.map(taskRow).join('')}</ul>`:'<div class="empty">Nothing on the list yet.</div>'}</div>
 <div class="sec">This week</div><div class="panel"><div class="week">${wk.join('')}</div></div>`}

function saveBtn(type,i){const on=S.saved.some(s=>s.t===type&&s.i===i);return `<span class="sp"></span><button class="ib ${on?'on':''}" data-act="fav" data-t="${type}" data-i="${i}" aria-label="${on?'Remove from saved':'Save'}" aria-pressed="${on}">${ic('heart')}</button>`}
const BODY={
 lesson(){const id=pick('lesson'),l=S.lessons.find(x=>x.id===id);

  ${y?`<details class="rec"><summary>Last time: do you remember &ldquo;${esc(y.w)}&rdquo;?</summary><p>${esc(y.d)}</p></details>`:''}
  <div class="row"><button class="btn sm" data-act="another" data-t="word">Another word</button></div>`}},

 laugh(){const i=pick('laugh'),j=JOKES[i];return {x:saveBtn('laugh',i),h:(j.q?`<p class="lead" style="font-size:1.4rem">${esc(j.q)}</p>${REVEAL?`<p class="punch">${esc(j.a)}</p>`:`<div class="row"><button class="btn pri" data-act="reveal">Tell me</button></div>`}`:`<p class="lead" style="font-size:1.4rem">${esc(j.a)}</p>`)+((!j.q||REVEAL)?`<div class="row"><button class="btn sm" data-act="another" data-t="laugh">Another one</button></div>`:'')}},
 list(){return {h:`<p class="kick">${S.g.on?'Everything on your plate. Star':'Empty your head, then star'} up to three that matter most today. The rest can wait.</p>`+listHTML()}}
};
function vDeck(n){const c=CARDS[n],b=BODY[c.id]();
 return `<div class="deck" style="--ac:${c.col}"><div class="dtop"><button class="ib" data-go="" aria-label="Back to Today">${ic('x')}</button><div class="segs">${CARDS.map((k,i)=>`<button data-go="deck/${i}" data-rep="1" class="${i===n?'cur':S.day.done[k.id]?'done':''}" aria-label="${k.name}"></button>`).join('')}</div><span class="cnt">${n+1}/${CARDS.length}</span></div>
 <article class="card panel" data-card="${c.id}"><div class="lab">${ic(c.id)}<span>${c.name}</span>${b.x||''}</div>${b.h}</article>
 <div class="dbar">${n>0?`<button class="btn" data-act="prev">${ic('back')} Back</button>`:''}<button class="btn pri" data-act="next" id="next">${n<CARDS.length-1?'Next: '+CARDS[n+1].name:'Finish'} ${ic('right')}</button></div></div>`}
function vDone(){const l=S.lessons.find(x=>x.id===S.day.pick.lesson),w=S.day.pick.word!=null?WORDS[S.day.pick.word]:null,f=S.tasks.filter(t=>t.star&&!t.done);
 const days=Object.keys(S.hist).length,nag=days>=7&&Date.now()-S.exportAt>30*864e5;
 return `<div class="done-h"><div class="big">${ic('check')}</div><h1 class="hello">Calibrated.</h1><p class="date">You know where you're pointed. Go do the first thing.</p></div>

 ${nag?`<div class="panel"><b>Keep your data safe</b><p class="note">Everything lives on this phone only. Save a backup file now and then.</p><div class="row"><button class="btn sm" data-act="export">Save a backup</button></div></div>`:''}

/* ---------- list ---------- */
function sorted(a){return a.slice().sort((x,y)=>(y.star||0)-(x.star||0)||String(x.pos||'~'+x.c).localeCompare(String(y.pos||'~'+y.c)))}
function taskRow(t){if(EDIT===t.id)return `<li class="edit"><input class="fld" id="edt" value="${esc(t.title)}" maxlength="500" aria-label="Edit task"><div style="display:flex;gap:8px"><button class="btn pri sm" data-act="esave" data-id="${t.id}">Save</button><button class="btn sm" data-act="ecancel">Cancel</button><span style="flex:1"></span><button class="btn sm" data-act="del" data-id="${t.id}" style="color:#b3261e">Delete</button></div></li>`;
 return `<li class="task ${t.done?'done':''}"><button class="chk" data-act="tog" data-id="${t.id}" role="checkbox" aria-checked="${!!t.done}" aria-label="${t.done?'Mark not done':'Mark done'}: ${esc(t.title)}"><i>${t.done?ic('check'):''}</i></button><button class="tt" data-act="edit" data-id="${t.id}">${esc(t.title)}</button>${t.due?`<span class="due">${esc(new Date(t.due).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'}))}</span>`:''}${t.done?'':`<button class="star ${t.star?'on':''}" data-act="star" data-id="${t.id}" aria-pressed="${!!t.star}" aria-label="Focus today">${ic('star')}</button>`}</li>`}
function gLine(){const g=S.g;if(!g.on)return `Your tasks live in Google Tasks? <button class="link" data-go="gsetup">Connect it</button>`;
 if(gState==='sync')return 'Checking Google Tasks&hellip;';
 if(gState==='offline')return 'Offline. Changes will reach Google Tasks when you are back online.';
 if(gState==='err')return (gErr==='key'?'The bridge did not accept the key. Run the setup again.':gErr==='badreply'?'Google did not answer as expected. Check the deploy settings (Execute as: Me, Who has access: Anyone).':gErr==='nolist'?'No Google Tasks list was found on that account.':'Could not reach Google Tasks.')+` <button class="link" data-act="gretry">Try again</button>`;

/* ---------- google tasks, through the owner's own bridge script ---------- */
const BK=KEY+'-bridge'; // bridge address and key live apart from app data so they never land in a backup
function bridge(){try{return JSON.parse(localStorage.getItem(BK))||{}}catch(e){return{}}}
function setBridge(b){localStorage.setItem(BK,JSON.stringify(b))}
function bridgeKey(){const b=bridge();if(!b.key){const a=new Uint8Array(24);crypto.getRandomValues(a);b.key=Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');setBridge(b)}return b.key}
const BRIDGE_SRC=[
"// Calibrate bridge. Runs inside your own Google account and lets the",
"// Calibrate app read and update one Google Tasks list. Keep this private.",
"var KEY = '@KEY@';",
"",
"function doPost(e) {",
"  var out;",
"  try {",
"    var q = JSON.parse(e.postData.contents);",
"    if (q.key !== KEY) throw new Error('key');",
"    out = run(q);",
"  } catch (err) {",
"    out = { error: String(err && err.message || err) };",
"  }",
"  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);",
"}",
"",
"function doGet() {",
"  return ContentService.createTextOutput('Calibrate bridge is running.');",
"}",
"",
"function run(q) {",
"  var lists = Tasks.Tasklists.list({ maxResults: 100 }).items || [];",
"  if (!lists.length) throw new Error('nolist');",
"  var want = String(q.list || '').toLowerCase().trim();",
"  var list = lists[0];",
"  for (var i = 0; i < lists.length; i++) if (lists[i].title.toLowerCase().trim() === want) list = lists[i];",
"  var results = [];",
"  (q.ops || []).forEach(function (o) {",
"    try {",
"      if (o.op === 'add') {",
"        var t = Tasks.Tasks.insert({ title: o.title }, list.id);",
"        results.push({ ref: o.ref, id: t.id, position: t.position });",
"      } else if (o.op === 'patch') {",
"        Tasks.Tasks.patch(o.done ? { title: o.title, status: 'completed' } : { title: o.title, status: 'needsAction', completed: null }, list.id, o.id);",
"        results.push({ ref: o.ref, ok: true });",
"      } else if (o.op === 'del') {",
"        Tasks.Tasks.remove(list.id, o.id);",
"      }",
"    } catch (err) {",
"      results.push({ ref: o.ref, err: String(err && err.message || err) });",
"    }",
"  });",
"  var tasks = [], page;",
"  do {",
"    var r = Tasks.Tasks.list(list.id, { maxResults: 100, showCompleted: false, pageToken: page });",
"    (r.items || []).forEach(function (t) {",
"      if (!t.deleted && String(t.title || '').trim()) tasks.push({ id: t.id, title: t.title, position: t.position, due: t.due || null });",
"    });",
"    page = r.nextPageToken;",
"  } while (page);",
"  return { list: list.title, lists: lists.map(function (l) { return l.title; }), results: results, tasks: tasks };",
"}"].join('\n');
const bridgeCode=()=>BRIDGE_SRC.replace('@KEY@',bridgeKey());
async function bcall(payload){const b=bridge();if(!b.url||!b.key)throw new Error('nobridge');
 const r=await fetch(b.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:b.key},payload))});
 let j;try{j=await r.json()}catch(e){throw new Error('badreply')}
 if(!j||j.error)throw new Error(j&&j.error==='key'?'key':j&&j.error==='nolist'?'nolist':'script');return j}
let gBusy=false,gAgain=false,gTimer=null,gErr='';
function gSoon(){if(!S.g.on)return;clearTimeout(gTimer);gTimer=setTimeout(gSync,1200)}
function gPaint(){const l=$('#gline');if(l)l.innerHTML=gLine()}
async function gSync(){if(!S.g.on)return;if(gBusy){gAgain=true;return}
 if(!navigator.onLine){gState='offline';gPaint();return}
 gBusy=true;gState='sync';gPaint();let changed=false;
 try{
  const ops=[],dels=S.gdel.slice(),sent=new Map();dels.forEach(id=>ops.push({op:'del',id}));
  S.tasks.forEach(t=>{if(!t.gid&&!t.done){ops.push({op:'add',ref:t.id,title:t.title});sent.set(t.id,{title:t.title,done:t.done?1:0})}
   else if(t.gid&&t.dirty){ops.push({op:'patch',ref:t.id,id:t.gid,title:t.title,done:!!t.done});sent.set(t.id,{title:t.title,done:t.done?1:0})}});
  const r=await bcall({list:S.g.list||'',ops});
  S.gdel=S.gdel.filter(id=>!dels.includes(id));
  (r.results||[]).forEach(x=>{const t=S.tasks.find(t=>t.id===x.ref);if(!t){if(x.id)S.gdel.push(x.id);return}if(x.id){t.gid=x.id;t.pos=x.position}
   const was=sent.get(x.ref);if(x.err){if(t.gid&&!x.id)t.dirty=0;return}t.dirty=(was&&(t.title!==was.title||(t.done?1:0)!==was.done))?1:0});
  const remote=new Map((r.tasks||[]).map(x=>[x.id,x]));
  for(const t of S.tasks){if(!t.gid||t.dirty)continue;const x=remote.get(t.gid);
   if(x){if(!t.done&&(t.title!==x.title||t.pos!==x.position||(t.due||null)!==(x.due||null))){t.title=x.title;t.pos=x.position;t.due=x.due||null;changed=true}remote.delete(t.gid)}
   else if(!t.done){t.done=1;t.doneAt=Date.now();t.star=0;changed=true}}
  remote.forEach(x=>{if(S.gdel.includes(x.id)||S.tasks.some(t=>t.gid===x.id))return;S.tasks.push({id:uid(),gid:x.id,title:x.title,done:0,pos:x.position,due:x.due||null,c:Date.now()});changed=true});
  if(S.g.title!==r.list)changed=true;
  S.g.title=r.list;S.g.lists=r.lists||[];S.g.at=Date.now();gState='ok';gErr='';save()
 }catch(e){gErr=e.message;gState=!navigator.onLine?'offline':'err';save()}
 gBusy=false;
 const a=route.split('/')[0],typing=document.activeElement&&document.activeElement.id==='newtask'&&document.activeElement.value;
 if(changed&&!EDIT&&!typing&&(a==='list'||a===''||a==='settings'||(a==='deck'&&CARDS[+route.split('/')[1]||0].id==='list')))render();else gPaint();
 if(gAgain||(gState==='ok'&&S.tasks.some(t=>t.gid&&t.dirty))){gAgain=false;gSoon()}}
addEventListener('online',()=>gSync());

 import(){$('#imp').click()},
 update(){if(SWR&&SWR.waiting)SWR.waiting.postMessage('skip');else location.reload()},
 async check(){if(!SWR){toast('Updates need the installed app or a web page.');return}try{await SWR.update();toast(SWR.waiting||SWR.installing?'Update found.':'You have the latest version.')}catch(e){toast('Could not check. Are you online?')}}
};
const FORM={
 add(f){const i=f.querySelector('#newtask'),v=(i.value||'').trim();if(!v)return;S.tasks.push({id:uid(),title:v,done:0,c:Date.now()});save();render();const n=$('#newtask');if(n)n.focus();gSoon()},
 lesson(){const x=($('#lx').value||'').trim();if(!x){toast('Write the lesson first.');return}S.lessons.push({id:uid(),t:($('#lt').value||'').trim(),x});save();render();toast('Lesson added')},
 ledit(f){const l=S.lessons.find(l=>l.id===f.dataset.id),x=($('#ex').value||'').trim();if(l&&x){l.t=($('#et').value||'').trim();l.x=x;save()}LEDIT=null;render()},
 async bridge(){const u=($('#burl').value||'').trim(),name=($('#blist').value||'').trim();
  if(!/^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[\w-]+\/exec$/.test(u)){toast('That is not a Web app URL. It starts with script.google.com and ends in /exec.');return}
  if(!navigator.onLine){toast('You are offline. Try again when connected.');return}
  const b=bridge();b.key=bridgeKey();b.url=u;setBridge(b);const btn=$('#bgo');if(btn){btn.disabled=true;btn.textContent='Checking…'}
  try{const r=await bcall({list:name,ops:[]});if(name&&r.list.toLowerCase().trim()!==name.toLowerCase()){S.g={list:''};save();if(btn){btn.disabled=false;btn.textContent='Connect'}toast('No list named "'+name+'". Yours: '+r.lists.join(', '));return}
   S.g={on:1,list:r.list,title:r.list,lists:r.lists};save();toast('Connected to '+r.list);go('list',true);gSync()}
  catch(e){const b2=bridge();delete b2.url;setBridge(b2);if(btn){btn.disabled=false;btn.textContent='Connect'}
   toast(e.message==='key'?'The key did not match. Copy the code again and redeploy.':e.message==='badreply'?'Google did not answer as expected. Check: Execute as Me, access Anyone.':e.message==='script'?'The script ran into an error. Is the Tasks API service added?':'Could not reach that address. Check the URL.')}}
};
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();stopMed(true);go(g.dataset.go,!!g.dataset.rep||route.split('/')[0]==='deck'&&g.dataset.go.startsWith('deck/'));return}
 const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){e.preventDefault();ACT[a.dataset.act](a)}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(f){e.preventDefault();FORM[f.dataset.form](f)}});
document.addEventListener('keydown',e=>{if(e.target.id==='edt'&&e.key==='Enter'){e.preventDefault();const b=document.querySelector('[data-act=esave]');if(b)ACT.esave(b)}});
document.addEventListener('change',e=>{const s=e.target.closest('[data-set]');
 if(s){if(s.dataset.set==='dayStart'){S.dayStart=+s.value;save();render();toast('Saved')}
  if(s.dataset.set==='glist'){S.tasks=S.tasks.filter(t=>!t.gid&&!t.done);S.gdel=[];S.g.list=s.value;S.g.title=s.value;S.g.at=0;save();render();gSync()}return}
 if(e.target.id==='imp'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result),d=o&&o.app==='calibrate'&&o.data;if(!d||d.v!==1)throw 0;localStorage.setItem(KEY,JSON.stringify(d));S=load();document.documentElement.classList.toggle('big',!!S.big);go('');toast('Backup restored')}catch(x){toast('That file is not a Calibrate backup.')}};r.readAsText(e.target.files[0]);e.target.value=''}});
/* swipe between cards */
let tx=0,ty=0,tOK=false;
addEventListener('touchstart',e=>{tOK=route.startsWith('deck/')&&!M&&!e.target.closest('input,textarea,.tasks,.pick');tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(!tOK)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>80&&Math.abs(dx)>2.5*Math.abs(dy))dx<0?ACT.next():ACT.prev()},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(S.day&&S.day.k!==dayKey()&&!M){go('');render(true)}else if(M&&!M.pause)wake(true);gSync()});

/* ---------- boot ---------- */
document.documentElement.classList.toggle('big',!!S.big);
let SWR=null;
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').then(r=>{SWR=r;const flag=()=>{if(r.waiting&&navigator.serviceWorker.controller)$('#upd').classList.add('on')};flag();r.addEventListener('updatefound',()=>{const w=r.installing;w&&w.addEventListener('statechange',flag)})}).catch(()=>{});
 let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload()})}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
render(true);gSync();
</script>
</body>
</html>
