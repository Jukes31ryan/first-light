<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calibrate</title>
<meta name="description" content="A few minutes to point the day: remember, center, learn, laugh, and pick what matters.">
<meta name="theme-color" content="#cfe6f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calibrate">
<style>
:root{--ink:#14283a;--mut:#587088;--line:rgba(20,40,58,.12);--card:rgba(255,255,255,.82);--pri:#1c5fae;--ac:#1c5fae;--ok:#1f8a5b;--r:22px;font-size:17px}
html.big{font-size:19.5px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);line-height:1.5;
 background:radial-gradient(120% 60% at 100% 0%,rgba(255,200,120,.55),rgba(255,200,120,0) 60%),linear-gradient(180deg,#c9e2f6 0%,#e3f0fa 45%,#f4f9fd 100%) fixed;overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
h1,h2,h3{margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
.hdr{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
.brand{font-weight:800;letter-spacing:.14em;font-size:.8rem;text-transform:uppercase;color:var(--mut)}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.ib:active{background:rgba(20,40,58,.08)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.panel{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:var(--r);box-shadow:0 8px 28px rgba(40,80,120,.12);padding:18px}
.panel+.panel{margin-top:14px}
.hello{font-size:1.75rem;font-weight:750;letter-spacing:-.01em}
.date{color:var(--mut);margin-top:2px}
.hero{display:flex;align-items:center;gap:16px;margin-top:14px}
.ring{width:76px;height:76px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.05rem}
.hero p{margin:0 0 10px;color:var(--mut);font-size:.95rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;font-weight:700;background:rgba(255,255,255,.75);border:1px solid var(--line)}
.btn.pri{background:var(--pri);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(28,95,174,.3)}
.btn.sm{min-height:44px;padding:0 16px;font-size:.92rem}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45}
.sec{font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:20px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.link{color:var(--pri);font-weight:650;text-decoration:underline;text-underline-offset:3px;font-size:.92rem;min-height:44px;display:inline-flex;align-items:center}
.steps{list-style:none;margin:0;padding:0}
.steps li+li{border-top:1px solid var(--line)}
.step{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:11px 2px;min-height:58px}
.dot{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;color:#fff;background:var(--c)}
.step .nm{font-weight:700}
.step .ds{color:var(--mut);font-size:.86rem;line-height:1.3}
.step .st{margin-left:auto;color:var(--mut);flex:none}
.step .st.ok{color:var(--ok)}
.week{display:flex;gap:8px;justify-content:space-between;margin-top:4px}
.week span{flex:1;text-align:center;font-size:.72rem;color:var(--mut)}
.week i{display:block;width:26px;height:26px;border-radius:50%;margin:0 auto 4px;border:2px solid rgba(20,40,58,.18)}
.week i.on{background:var(--ok);border-color:var(--ok)}
.week i.now{border-color:var(--pri)}
/* tabs */
#tabs{display:flex;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:.72rem;font-weight:650;color:var(--mut);min-height:56px}
#tabs button.on{color:var(--pri)}
#tabs.hide{display:none}
/* deck */
.deck{display:flex;flex-direction:column;min-height:100%}
.dtop{display:flex;align-items:center;gap:8px;margin:-6px -4px 10px}
.segs{flex:1;display:flex;gap:5px}
.segs button{flex:1;height:28px;display:flex;align-items:center}
.segs button::before{content:"";display:block;width:100%;height:6px;border-radius:3px;background:rgba(20,40,58,.15)}
.segs button.done::before{background:rgba(20,40,58,.45)}
.segs button.cur::before{background:var(--ac)}
.cnt{font-size:.8rem;color:var(--mut);font-weight:700;min-width:30px;text-align:right;margin-right:6px}
.card{flex:1;animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.lab{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem;color:var(--ac);margin-bottom:14px}
.lab .sp{flex:1}
.lab .ib{color:var(--mut);margin:-11px -8px -11px 0}
.lab .ib.on{color:#d1365a}
.lab .ib.on svg{fill:currentColor}
.kick{color:var(--mut);font-size:.92rem;margin:0 0 6px}
.card h2{font-size:1.7rem;letter-spacing:-.01em}
.lead{font-size:1.3rem;line-height:1.45;margin:12px 0 0}
.serif{font-family:"Iowan Old Style",Charter,Georgia,"Times New Roman",serif}
.story p{margin:0 0 1em;font-size:1.08rem;line-height:1.65}
.take{border-left:4px solid var(--ac);padding:10px 14px;background:rgba(255,255,255,.6);border-radius:0 14px 14px 0;margin-top:6px}
.take b{display:block;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);margin-bottom:2px}
.pron{color:var(--mut);margin-top:4px}
.ex{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.6);font-style:italic}
.chip{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--ac);color:#fff;font-size:.76rem;font-weight:750;letter-spacing:.04em}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
details.rec{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
details.rec summary{cursor:pointer;font-weight:650;min-height:40px;display:flex;align-items:center}
.punch{font-size:1.3rem;font-weight:700;margin-top:16px;animation:in .25s ease both}
.dbar{display:flex;gap:10px;margin-top:18px;padding-bottom:4px}
.dbar .btn{flex:1}
.dbar .btn.pri{flex:2}
/* meditation */
.med{text-align:center}
.orb{width:170px;height:170px;border-radius:50%;margin:18px auto 14px;background:radial-gradient(circle at 35% 30%,#fff,rgba(120,200,200,.55) 60%,rgba(43,140,140,.5));box-shadow:0 0 0 14px rgba(43,140,140,.1),0 0 0 30px rgba(43,140,140,.06);display:grid;place-items:center;font-weight:700;color:#1d5f5f}
.orb.go{animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.78)}40%{transform:scale(1.08)}}
.cue{min-height:5.2em;font-size:1.15rem;line-height:1.45;max-width:26em;margin:0 auto}
.time{font-variant-numeric:tabular-nums;color:var(--mut);font-weight:700;margin-top:4px}
.pick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.pick button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.7);font-weight:650}
.pick button.on{background:var(--ac);color:#fff;border-color:transparent}
/* list */
.add{display:flex;gap:8px}
.add input,.fld{flex:1;min-width:0;min-height:50px;border-radius:16px;border:1px solid var(--line);background:#fff;padding:0 14px;width:100%}
textarea.fld{padding:12px 14px;min-height:96px;resize:vertical;display:block}
.gline{font-size:.85rem;color:var(--mut);margin:10px 2px 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:28px}
.tasks{list-style:none;margin:6px 0 0;padding:0}
.task{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);min-height:54px}
.task:first-child{border-top:0}
.chk{width:44px;height:44px;display:grid;place-items:center;flex:none}
.chk i{width:26px;height:26px;border-radius:50%;border:2px solid rgba(20,40,58,.35);display:grid;place-items:center;color:#fff}
.task.done .chk i{background:var(--ok);border-color:var(--ok)}
.tt{flex:1;min-width:0;padding:10px 0;overflow-wrap:anywhere;text-align:left}
.task.done .tt{text-decoration:line-through;color:var(--mut)}
.due{font-size:.75rem;color:var(--mut);flex:none}
.star{width:44px;height:44px;display:grid;place-items:center;color:rgba(20,40,58,.25);flex:none}
.star.on{color:#e0a100}
.star.on svg{fill:currentColor}
.empty{color:var(--mut);text-align:center;padding:18px 8px}
.edit{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.less{padding:12px 0;border-top:1px solid var(--line)}
.less:first-child{border-top:0}
.less b{display:block}
.note{color:var(--mut);font-size:.9rem;margin:8px 0 0}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-height:56px}
.set:first-child{border-top:0}
.set select{min-height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 10px;max-width:55%}
ol.how{padding-left:1.2em;margin:10px 0}
ol.how li{margin-bottom:8px}
code{background:rgba(20,40,58,.08);padding:2px 6px;border-radius:6px;font-size:.9em;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#14283a;color:#fff;padding:11px 18px;border-radius:999px;font-size:.92rem;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%)}
#upd{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:9}
#upd.on{display:block}
.done-h{text-align:center;padding:26px 8px 8px}
.done-h .big{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 10px 26px rgba(31,138,91,.35)}
.done-h .big svg{width:42px;height:42px;stroke-width:2.6}
.recap{margin:0;padding:0;list-style:none}
.recap li{padding:10px 0;border-top:1px solid var(--line)}
.recap li:first-child{border-top:0}
.recap small{display:block;color:var(--mut);font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <main id="view" tabindex="-1"></main>
 <nav id="tabs" aria-label="Sections"></nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="upd"><button class="btn pri sm" data-act="update">Update ready. Tap to refresh</button></div>
<script>
'use strict';
const APP_VERSION='6.1';
const RAW_WORDS="equanimity|ee-kwuh-NIM-ih-tee|noun|Calm and steadiness, especially under pressure.|She took the bad news with equanimity and asked what came next.\nephemeral|ih-FEM-er-ul|adjective|Lasting only a very short time.|The morning fog was ephemeral, gone before the coffee was done.\nlaconic|luh-KON-ik|adjective|Using very few words.|His laconic reply was one word: \"No.\"\nsanguine|SANG-gwin|adjective|Optimistic, especially when things look hard.|She stayed sanguine about the project even after the setback.\ntenacious|tuh-NAY-shus|adjective|Holding on firmly; not giving up easily.|A tenacious climber takes the mountain one hold at a time.\nubiquitous|yoo-BIK-wih-tus|adjective|Seeming to be everywhere at once.|Phones are so ubiquitous that silence feels strange.\nmagnanimous|mag-NAN-ih-mus|adjective|Generous and forgiving, especially toward a rival.|He was magnanimous in victory and praised the other team first.\nfastidious|fa-STID-ee-us|adjective|Very attentive to detail and hard to please.|A fastidious mechanic wipes every bolt before it goes back in.\nperspicacious|pur-spih-KAY-shus|adjective|Quick to notice and understand what others miss.|A perspicacious friend saw the worry behind her smile.\nsagacious|suh-GAY-shus|adjective|Wise, with sound judgment.|The sagacious move was to wait a day before answering.\nalacrity|uh-LAK-rih-tee|noun|Cheerful, eager readiness.|He accepted the chance with alacrity.\nameliorate|uh-MEEL-yuh-rayt|verb|To make a bad situation better.|A short walk can ameliorate a rough mood.\nanachronism|uh-NAK-ruh-niz-um|noun|Something out of place in its time period.|A wristwatch in a movie about Rome is an anachronism.\napocryphal|uh-POK-rih-ful|adjective|Widely told but probably not true.|The story about the general and the cherry tree is apocryphal.\nassiduous|uh-SIJ-oo-us|adjective|Showing steady, careful effort.|Assiduous practice beats occasional brilliance.\naustere|aw-STEER|adjective|Plain and strict, without comfort or decoration.|The cabin was austere: a bed, a stove, a window.\nbenevolent|buh-NEV-uh-lunt|adjective|Kind and meaning well toward others.|A benevolent boss assumes you had a reason.\nbombastic|bom-BAS-tik|adjective|Sounding important but saying little.|The bombastic speech ran long and promised nothing.\ncacophony|kuh-KOF-uh-nee|noun|A harsh, jumbled mix of sounds.|The kitchen at breakfast was a cacophony of pans and voices.\ncandor|KAN-der|noun|Open, honest speech.|I appreciated her candor, even when it stung.\ncapricious|kuh-PRISH-us|adjective|Changing suddenly without a clear reason.|Mountain weather is capricious, so pack a jacket.\ncatalyst|KAT-uh-list|noun|Something that sets a change in motion.|One honest conversation was the catalyst for everything after.\ncircumspect|SUR-kum-spekt|adjective|Careful to consider the risks before acting.|Be circumspect about what you promise on a Monday.\ncogent|KOH-junt|adjective|Clear, logical and convincing.|She made a cogent case in three sentences.\ncommensurate|kuh-MEN-sur-it|adjective|Matching in size or degree.|The reward should be commensurate with the effort.\nconflate|kun-FLAYT|verb|To blend two separate things into one by mistake.|Don't conflate being busy with being useful.\nconundrum|kuh-NUN-drum|noun|A confusing, difficult problem.|How to be in two places at once is the parent's daily conundrum.\ncopious|KOH-pee-us|adjective|In large amounts.|He took copious notes and read none of them.\ncredulous|KREJ-uh-lus|adjective|Too ready to believe things.|A credulous reader shares the headline without opening the story.\ncursory|KUR-suh-ree|adjective|Quick and not thorough.|A cursory glance missed the typo in the first line.\ndearth|durth|noun|A lack or shortage of something.|There is no dearth of advice, only of people who follow it.\ndebacle|dih-BAH-kul|noun|A sudden, complete failure.|The surprise party turned into a debacle when the guest of honor left town.\ndeference|DEF-er-uns|noun|Polite respect for someone's wishes or judgment.|Out of deference to the cook, he tried the soup.\ndeleterious|del-ih-TEER-ee-us|adjective|Harmful, often in a slow or hidden way.|Skipping sleep has a deleterious effect on judgment.\ndidactic|dy-DAK-tik|adjective|Meant to teach, sometimes in a preachy way.|The film was fun until it turned didactic.\ndiffident|DIF-ih-dunt|adjective|Shy because of low confidence.|He was diffident in meetings but brilliant on paper.\ndilettante|DIL-ih-tahnt|noun|Someone who dabbles without real commitment.|He was a dilettante at guitar: three chords and four excuses.\ndiscern|dih-SURN|verb|To recognize or tell apart with care.|It takes time to discern what matters from what is merely loud.\ndisparate|DIS-per-it|adjective|Very different; not easily compared.|She tied three disparate ideas into one plan.\ndogmatic|dawg-MAT-ik|adjective|Insisting your beliefs are certainly right.|Stay firm on values and less dogmatic about methods.\nebullient|ih-BUL-yunt|adjective|Overflowing with cheerful energy.|The kids were ebullient on the first snow day.\neclectic|ih-KLEK-tik|adjective|Drawing from a wide mix of sources.|His playlist is eclectic: banjo, opera and movie scores.\nefficacy|EF-ih-kuh-see|noun|The power to produce the result you want.|The efficacy of a plan shows up on Tuesday, not on paper.\negregious|ih-GREE-jus|adjective|Shockingly bad.|Forgetting the anniversary twice was an egregious error.\neloquent|EL-uh-kwunt|adjective|Clear, graceful and persuasive in speech or writing.|Her silence was more eloquent than his speech.\nempirical|em-PEER-ih-kul|adjective|Based on observation, not theory.|The empirical test is simple: did it work?\nenervate|EN-er-vayt|verb|To drain of energy. (It does not mean energize.)|The long meeting enervated the whole room.\nenigma|ih-NIG-muh|noun|A person or thing that is hard to understand.|The cat remains an enigma to everyone in the house.\nennui|ahn-WEE|noun|Listless boredom and dissatisfaction.|Scrolling cures ennui for about nine seconds.\nepiphany|ih-PIF-uh-nee|noun|A sudden, clear realization.|In the shower he had an epiphany about the stuck project.\nepitome|ih-PIT-uh-mee|noun|A perfect example of something.|She is the epitome of calm in a crisis.\nequivocate|ih-KWIV-uh-kayt|verb|To speak vaguely to avoid committing.|Asked for a date, he began to equivocate.\nerudite|AIR-yoo-dyt|adjective|Having deep, wide learning.|An erudite neighbor can explain both the stars and the plumbing.\nesoteric|es-uh-TAIR-ik|adjective|Understood by only a small group.|The manual was full of esoteric terms.\neuphemism|YOO-fuh-miz-um|noun|A mild word used in place of a harsh one.|\"Let go\" is a euphemism for fired.\nexacerbate|ig-ZAS-er-bayt|verb|To make a problem worse.|Replying while angry will only exacerbate it.\nexonerate|ig-ZON-uh-rayt|verb|To clear of blame.|The video exonerated the dog; the toddler ate the cake.\nexpedient|ik-SPEE-dee-unt|adjective|Convenient and practical, though maybe not right.|The expedient choice is not always the honest one.\nextol|ik-STOHL|verb|To praise highly.|Grandpa would extol the virtues of a cold-water rinse.\nfacetious|fuh-SEE-shus|adjective|Joking at a moment that may not call for it.|I was being facetious; please don't actually sell the car.\nfallacy|FAL-uh-see|noun|A mistaken belief or a flaw in reasoning.|It is a fallacy that being busy means making progress.\nfervent|FUR-vunt|adjective|Showing strong, warm feeling.|He is a fervent believer in a real breakfast.\nfortitude|FOR-tih-tood|noun|Strength of mind in pain or difficulty.|It takes fortitude to keep showing up when nobody notices.\nfrugal|FROO-gul|adjective|Careful with money and resources.|Frugal is not cheap; it is deciding what is worth it.\nfurtive|FUR-tiv|adjective|Secretive, hoping not to be noticed.|He cast a furtive glance at the last cookie.\ngalvanize|GAL-vuh-nyz|verb|To shock or excite into action.|The deadline galvanized the whole team.\ngarrulous|GAIR-uh-lus|adjective|Talking a lot, especially about small things.|The garrulous barber knew everyone's business.\ngregarious|grih-GAIR-ee-us|adjective|Sociable; fond of company.|Her gregarious brother knew the whole street within a week.\nhackneyed|HAK-need|adjective|Overused to the point of being dull.|\"Think outside the box\" is a hackneyed phrase.\nhalcyon|HAL-see-un|adjective|Describing a calm, happy time in the past.|He talks about the halcyon summers at the lake.\nharbinger|HAR-bin-jer|noun|A sign that something is coming.|The first robin is a harbinger of spring.\nhubris|HYOO-bris|noun|Excessive pride that leads to a fall.|It was hubris to skip the checklist.\niconoclast|eye-KON-uh-klast|noun|Someone who attacks cherished beliefs or traditions.|Every field needs one iconoclast asking why it is done this way.\nidiosyncrasy|id-ee-oh-SING-kruh-see|noun|A personal habit or quirk.|Eating pizza crust-first is his idiosyncrasy.\nimpetus|IM-pih-tus|noun|The force that gets something moving.|The checkup was the impetus he needed to start walking.\nimpervious|im-PUR-vee-us|adjective|Not affected or not able to be penetrated.|He seemed impervious to criticism and to rain.\nincisive|in-SY-siv|adjective|Sharp, clear and direct in thought.|One incisive question saved an hour of discussion.\nindefatigable|in-dih-FAT-ih-guh-bul|adjective|Never seeming to tire.|The indefatigable coach was first in and last out.\nindelible|in-DEL-uh-bul|adjective|Impossible to remove or forget.|That trip left an indelible mark on the kids.\nineffable|in-EF-uh-bul|adjective|Too great to be put into words.|There is an ineffable quiet just before sunrise.\ninexorable|in-EK-ser-uh-bul|adjective|Impossible to stop or change.|The inexorable tide took the sandcastle.\ningenuous|in-JEN-yoo-us|adjective|Innocent and openly sincere.|Her ingenuous question made the whole room rethink the plan.\ninnate|ih-NAYT|adjective|Present from birth, not learned.|Curiosity is innate; schedules have to be taught.\ninsidious|in-SID-ee-us|adjective|Harmful in a gradual, hard-to-no \nSpace|On the Moon, a hammer and a feather dropped together land at the same time. Apollo 15 tested it on camera.\nBody|Your heart beats about 100,000 times a day.\nBody|Babies are born with around 300 bones. Many fuse as they grow, leaving adults with 206.\nBody|Your body carries roughly as many bacterial cells as human cells.\nBody|The cornea is the only part of the body with no blood supply. It takes oxygen straight from the air.\nBody|The fastest nerve signals travel at more than 250 miles per hour.\nBody|You are slightly taller in the morning. The discs in your spine compress during the day.\nBody|Your brain is about 2% of your body weight but uses about 20% of your energy.\nBody|The liver can regrow to full size from as little as about a quarter of its tissue.\nBody|A red blood cell lives about 120 days and can circle your whole body in about a minute.\nBody|Any two people share about 99.9% of their DNA.\nBody|The smallest bone in your body, the stapes in the middle ear, is about the size of a grain of rice.\nBody|Koalas have fingerprints so similar to human ones that they can be confused under a microscope.\nBody|Your small intestine is about 20 feet long.\nBody|Goosebumps are a leftover reflex from when our ancestors had thick body hair to fluff up for warmth.\nBody|Humans give off a faint visible glow, but it is about a thousand times too weak for our eyes to see.\nBody|Being awake for 17 to 19 hours can slow your reactions about as much as a blood alcohol level of 0.05%.\nBody|Your stomach lining replaces itself every few days so that it does not digest itself.\nBody|The human eye can detect a single photon of light under the right conditions.\nAnimals|An octopus has three hearts and blue blood, and most of its neurons are in its arms.\nAnimals|Honey bees tell each other where flowers are with a \"waggle dance\" that encodes direction and distance.\nAnimals|Hummingbirds are the only birds that can truly fly backward.\nAnimals|A group of flamingos is called a flamboyance.\nAnimals|Sea otters often hold hands while they sleep so they do not drift apart.\nAnimals|Sharks are older than trees. They have been around for more than 400 million years.\nAnimals|Greenland sharks can live for more than 250 years, the longest of any known vertebrate.\nAnimals|Crows can recognize individual human faces and remember people who treated them badly for years.\nAnimals|Tardigrades, tiny eight-legged \"water bears,\" have survived exposure to the vacuum of space.\nAnimals|The Arctic tern migrates from the Arctic to the Antarctic and back every year, a round trip of roughly 44,000 miles.\nAnimals|A blue whale's heart weighs around 400 pounds.\nAnimals|Butterflies taste with their feet.\nAnimals|Wombat droppings are cube-shaped.\nAnimals|Cats cannot taste sweetness. They lack a working gene for the sweet receptor.\nAnimals|Cheetahs cannot roar. They purr, chirp and meow.\nAnimals|Bats are the only mammals capable of true powered flight.\nAnimals|Axolotls can regrow whole limbs, parts of their heart and even parts of their brain.\nAnimals|One jellyfish, Turritopsis dohrnii, can revert to its juvenile stage and start its life cycle over.\nAnimals|Pigeons have been trained to tell paintings by Monet from paintings by Picasso.\nAnimals|An ostrich's eye is bigger than its brain.\nAnimals|A mantis shrimp punches so fast that it boils the water around its claw for an instant.\nAnimals|Emperor penguin fathers balance the egg on their feet for about two months of Antarctic winter without eating.\nAnimals|Dolphins sleep with half their brain at a time so they can keep surfacing to breathe.\nAnimals|Giraffes and humans have the same number of neck bones: seven.\nAnimals|Polar bears have black skin, and their fur is not white but transparent.\nAnimals|Reindeer eyes change color with the seasons, from gold in summer to blue in winter.\nAnimals|Much of the white sand on tropical beaches is coral that parrotfish have eaten and passed.\nAnimals|Elephants are among the few animals that can recognize themselves in a mirror.\nAnimals|A dog's sense of smell is estimated to be at least 10,000 times more sensitive than ours.\nAnimals|To make one pound of honey, a hive's bees visit around two million flowers.\nAnimals|Koalas sleep up to about 20 hours a day.\nAnimals|Birds are living dinosaurs. A chicken is more closely related to T. rex than a crocodile is.\nAnimals|T. rex lived closer in time to us than to Stegosaurus.\nAnimals|Ants can carry many times their own body weight, in some species more than 20 times.\nEarth|Lightning strikes somewhere on Earth about 100 times every second.\nEarth|A bolt of lightning is about five times hotter than the surface of the Sun.\nEarth|The Sahara was green a few thousand years ago, with lakes, grasslands and hippos.\nEarth|Antarctica is the largest desert in the world. A desert is defined by how little precipitation it gets, not by heat.\nEarth|The Pacific Ocean is larger than all of Earth's land put together.\nEarth|The deepest point in the ocean, Challenger Deep, is nearly seven miles down.\nEarth|Only about 3% of Earth's water is fresh, and most of that is locked in ice.\nEarth|Some bamboo can grow almost three feet in a single day.\nEarth|A bristlecone pine in California is more than 4,800 years old. It was a seedling before the pyramids were finished.\nEarth|The largest known living organism is a honey fungus in Oregon that spreads across more than three square miles.\nEarth|The smell of rain on dry ground has a name: petrichor.\nEarth|Hawaii moves toward Japan about three inches a year.\nEarth|The shore of the Dead Sea is the lowest land on Earth, more than 1,400 feet below sea level.\nEarth|Russia spans 11 time zones.\nEarth|Alaska is the northernmost, westernmost and easternmost U.S. state, because its islands cross the 180th meridian.\nEarth|Reno, Nevada is farther west than Los Angeles.\nEarth|Maine is the closest U.S. state to Africa.\nEarth|Australia is wider than the Moon.\nEarth|Africa is larger than the United States, China, India and most of Europe combined.\nEarth|Monaco is smaller than New York's Central Park.\nEarth|Lake Baikal in Siberia holds about a fifth of the world's unfrozen fresh surface water.\nEarth|A day on Earth is getting longer by about two thousandths of a second per century. For the dinosaurs, a day was about 23 and a half hours.\nEarth|A typical fair-weather cumulus cloud weighs about a million pounds.\nEarth|Seen from an airplane, a rainbow can be a full circle. The ground normally hides the bottom half.\nEarth|About half of the oxygen you breathe was made by plankton in the ocean.\nEarth|Mount Thor in Canada has the world's tallest purely vertical drop, about 4,100 feet.\nEarth|Istanbul sits on two continents, Europe and Asia.\nEarth|Finland has about three million saunas for about five and a half million people.\nEarth|Scotland's national animal is the unicorn.\nHistory|Cleopatra lived closer in time to the Moon landing than to the building of the Great Pyramid.\nHistory|Oxford University is older than the Aztec Empire. Teaching began at Oxford around 1096; the Aztec capital was founded in 1325.\nHistory|The Great Pyramid of Giza was the tallest structure humans had built for about 3,800 years.\nHistory|Woolly mammoths were still alive on a remote Arctic island when the Great Pyramid was built.\nHistory|The shortest war on record, between Britain and Zanzibar in 1896, lasted less than 45 minutes.\nHistory|The fax machine was patented in 1843, more than 30 years before the telephone.\nHistory|Nintendo was founded in 1889 as a maker of playing cards.\nHistory|The lighter was invented before the friction match.\nHistory|Abraham Lincoln is in the National Wrestling Hall of Fame. He was a noted wrestler as a young man.\nHistory|Ancient Roman concrete can heal its own cracks. Lumps of lime in the mix react with water and seal them.\nHistory|Vikings reached North America around the year 1000, nearly 500 years before Columbus.\nHistory|The Statue of Liberty was the color of a new penny when it arrived. It took about 30 years to turn green.\nHistory|The Eiffel Tower can be about six inches taller on a hot summer day because the iron expands.\nHistory|Ada Lovelace wrote what is often called the first computer program in 1843, a century before modern computers.\nHistory|In 1947, engineers found a real moth stuck in a Harvard computer and taped it into the logbook as the \"first actual case of bug being found.\"\nHistory|The computer that guided Apollo 11 to the Moon had about four kilobytes of working memory.\nHistory|The first message sent over the early internet in 1969 was \"LO.\" The system crashed before \"LOGIN\" could be finished.\nHistory|The first webcam was set up at Cambridge University to watch a coffee pot, so researchers could see whether it was empty.\nHistory|Bluetooth is named after Harald Bluetooth, a tenth-century Viking king. The logo combines the runes for his initials.\nHistory|Tug of war was an Olympic event from 1900 to 1920.\nHistory|Basketball was first played in 1891 with a soccer ball and two peach baskets.\nHistory|The marathon became 26.2 miles at the 1908 London Olympics, partly to fit the route between Windsor Castle and the stadium.\nHistory|The first speeding ticket was issued in England in 1896 to a man doing 8 miles per hour.\nHistory|Stop signs in the United States were yellow until 1954.\nHistory|Ketchup was sold as a medicine in the 1830s.\nHistory|Aztecs used cacao beans as money.\nHistory|The Mona Lisa was not especially famous until it was stolen from the Louvre in 1911.\nHistory|Dr. Seuss wrote \"Green Eggs and Ham\" on a bet that he could not write a book using only 50 different words.\nHistory|The 4th Earl of Sandwich gave the sandwich its name; he is said to have wanted a meal he could eat without leaving the table.\nHistory|Bubble wrap was invented in 1957 as a textured wallpaper. It failed at that.\nHistory|Play-Doh began as a wallpaper cleaner.\nHistory|The microwave oven came from an accident. In 1945 an engineer noticed a candy bar had melted in his pocket near a radar tube.\nHistory|Velcro was inspired by burrs that stuck to an engineer's dog after a walk.\nHistory|The glue on sticky notes was a failed attempt to make a super-strong adhesive.\nHistory|Penicillin was discovered in 1928 when mold contaminated a lab dish left out over a vacation.\nHistory|The man who designed the Pringles can, Fredric Baur, had some of his ashes buried in one.\nScience|Bananas are slightly radioactive because they contain potassium.\nScience|Diamond and pencil lead are both pure carbon. Only the arrangement of the atoms differs.\nScience|Helium was discovered on the Sun, in 1868, before it was found on Earth.\nScience|Sound travels more than four times faster in water than in air.\nScience|If an atom were the size of a football stadium, its nucleus would be about the size of a pea at midfield.\nScience|Gallium is a metal that melts in your hand. Its melting point is about 86 degrees Fahrenheit.\nScience|Birds cannot feel the burn of hot peppers. That is how pepper plants get their seeds spread.\nScience|Time runs slightly faster at the top of a mountain than at sea level. Atomic clocks can measure the difference over a single foot of height.\nScience|GPS satellites have to correct for relativity. Without it, their clocks would drift by about 38 millionths of a second a day and your position would be off by miles.\nScience|At one exact temperature and pressure, called the triple point, water boils and freezes at the same time.\nScience|Honey can stay edible for thousands of years. Jars found in Egyptian tombs were still good.\nScience|Absolute zero, the coldest possible temperature, is about 459.67 degrees below zero Fahrenheit.\nScience|Steel bridges and railroad tracks get longer in the heat. Engineers build in gaps so they have room to grow.\nScience|A photon made in the Sun's core can take many thousands of years to work its way to the surface, then about eight minutes to reach you.\nFood|Bananas are berries, botanically speaking, and strawberries are not.\nFood|Peanuts are not nuts. They are legumes, related to beans and peas.\nFood|Carrots were commonly purple, white or yellow before orange ones became popular in the Netherlands in the 1600s.\nFood|Apples float because about a quarter of their volume is air.\nFood|Pound cake got its name from the recipe: a pound each of flour, butter, eggs and sugar.\nFood|German chocolate cake is American. It is named after Samuel German, who developed the baking chocolate.\nFood|Coffee beans are the seeds of a small red fruit called a coffee cherry.\nFood|A pineapple plant takes about two years to produce a single fruit.\nFood|Almonds are seeds, and the almond tree is a close relative of the peach.\nFood|White chocolate contains cocoa butter but no cocoa solids.\nFood|The potato was the first vegetable grown in space, in 1995.\nFood|It takes roughly 75,000 saffron flowers to make one pound of the spice.\nFood|Cashews grow on the outside of a fruit, hanging from the bottom of the cashew apple.\nWords|The dot over a lowercase i or j is called a tittle.\nWords|\"Goodbye\" is a shortening of \"God be with ye.\"\nWords|\"Quarantine\" comes from the Italian for 40 days, the time ships had to wait offshore during the plague.\nWords|\"Salary\" comes from the Latin word for salt.\nWords|\"Muscle\" comes from the Latin for \"little mouse,\" because a flexing muscle looked like a mouse under the skin.\nWords|\"Disaster\" literally means \"bad star.\"\nWords|\"Clue\" comes from \"clew,\" a ball of thread, like the one Theseus used to find his way out of the labyrinth.\nWords|\"Nice\" once meant foolish or ignorant.\nWords|\"Robot\" comes from a Czech word for forced labor. It first appeared in a 1920 play.\nWords|\"Checkmate\" comes from a Persian phrase often translated as \"the king is helpless.\"\nWords|\"OK\" began as a joke in an 1839 Boston newspaper: an abbreviation of \"oll korrect.\"\nWords|\"Decimate\" originally meant to kill one in every ten.\nWords|\"Mortgage\" comes from Old French for \"dead pledge.\"\nWords|\"Sarcasm\" comes from a Greek word meaning \"to tear flesh.\"\nWords|\"Panic\" is named after the Greek god Pan, whose shout was said to terrify travelers in lonely places.\nWords|\"Deadline\" once meant a line around a Civil War prison camp. Prisoners who crossed it could be shot.\nWords|\"Companion\" literally means someone you share bread with.\nWords|\"Window\" comes from Old Norse for \"wind eye.\"\nWords|\"Whiskey\" comes from a Gaelic phrase meaning \"water of life.\"\nWords|The \"mare\" in \"nightmare\" was an evil spirit believed to sit on sleepers' chests.\nWords|The ampersand (&) was once recited as the 27th letter of the alphabet. Its name is a slurring of \"and per se and.\"\nWords|\"Uncopyrightable\" is one of the longest English words that uses no letter twice.\nWords|The Hawaiian alphabet has only 13 letters.\nWords|\"Forty\" is the only number in English whose letters are in alphabetical order.\nWords|\"Four\" is the only number in English with the same number of letters as its value.\nMind|Unfinished tasks nag at your memory more than finished ones. It is called the Zeigarnik effect, and writing a plan for them quiets it.\nMind|Walking through a doorway really can make you forget what you came for. The brain files the old room away as a finished scene.\nMind|People overestimate how much others notice about them. Psychologists call it the spotlight effect.\nMind|We judge an experience mostly by its best or worst moment and by how it ended, not by its average.\nMind|Nobody truly multitasks on demanding work. The brain switches back and forth, and each switch costs time and accuracy.\nMind|Putting a feeling into words, even just \"I'm anxious,\" measurably calms the brain's alarm center.\nMind|About 20 minutes in nature is enough to lower stress hormones measurably.\nMind|In one well-known study, forming a new habit took 66 days on average, with a range from 18 to 254.\nMind|People value things more when they have built them themselves. Researchers named it the IKEA effect.\nMind|People consistently underestimate how long their own tasks will take, even when they know past ones ran late. It is called the planning fallacy.\nMind|Quizzing yourself beats re-reading. Pulling a fact out of memory strengthens it more than putting it back in.\nMind|Spreading practice over several days beats cramming the same hours into one.\nMind|Deciding ahead of time \"if X happens, I will do Y\" makes people far more likely to follow through.\nMind|Losing something hurts about twice as much as gaining the same thing feels good.\nMind|Feeling awe, such as from a mountain view or a night sky, makes people feel they have more time.\nMind|In a Stanford study, people came up with about 60% more creative ideas while walking than while sitting.\nMind|Once you notice something new, you start seeing it everywhere. It is called the frequency illusion.\nMind|People adapt to good and bad changes faster than they expect. Most of the joy of a new thing fades in months.\nMind|We tend to like people more after they make a small, human blunder, as long as they seemed capable first.\nMind|The less people know about a subject, the more they tend to overrate their skill in it.\nNumbers|There are more ways to shuffle a deck of cards than there are atoms on Earth. Any well-shuffled deck has almost certainly never existed before.\nNumbers|In a room of just 23 people, there is a better than even chance that two share a birthday.\nNumbers|If you could fold a sheet of paper in half 42 times, it would be thick enough to reach the Moon.\nNumbers|A million seconds is about eleven and a half days. A billion seconds is nearly 32 years.\nNumbers|A penny doubled every day for 30 days becomes more than five million dollars.\nNumbers|111,111,111 times 111,111,111 equals 12,345,678,987,654,321.\nNumbers|A Rubik's Cube has about 43 quintillion possible arrangements, and every one of them can be solved in 20 moves or fewer.\nNumbers|There are more possible games of chess than atoms in the observable universe.\nNumbers|NASA uses only about 15 decimal places of pi for interplanetary navigation.\nNumbers|A googol is a 1 followed by 100 zeros, more than the number of atoms in the observable universe.\nNumbers|Every odd number, written out in English, contains the letter E.\nEveryday|U.S. paper money is not paper. It is about 75% cotton and 25% linen.\nEveryday|Olympic gold medals are mostly silver, with a thin plating of gold.\nEveryday|LEGO makes more tires than any other company in the world, counting the tiny ones.\nEveryday|A U.S. dime has 118 ridges around its edge.\nEveryday|Every baseball used in the major leagues is rubbed with mud from one secret spot along a New Jersey river.\nEveryday|An average NFL broadcast runs about three hours, but the ball is in play for only around 11 minutes.\nEveryday|At least one of the colors of the Olympic rings and their white background appears on every national flag.\nEveryday|A concert of a single John Cage piece began in a German church in 2001 and is scheduled to end in 2640.\nEveryday|Email is older than the World Wide Web by about 20 years.\nEveryday|The \"QWERTY\" keyboard layout dates back to typewriters of the 1870s.";
const STORIES=[{"t":"The Empty Cup","s":"A professor of philosophy, well published and widely respected, traveled a long way to visit a Zen master he had heard about for years. He arrived with a list of questions about the nature of wisdom.\n\nThe master welcomed him warmly and set water on to boil. But before a single question could be asked, the professor began to explain what he already understood. He described the schools he had studied, the books he had written, the debates he had won. He wanted the master to know he was not a beginner. Twenty minutes passed this way.\n\nThe master said nothing. He simply lifted the pot and began pouring tea into the professor's cup. The cup filled. The master kept pouring. Tea rose to the brim, spilled over the lip, ran across the table and dripped steadily onto the floor.\n\n“Stop!” the professor cried, jumping back. “It's full! No more will go in!”\n\nThe master set down the pot and looked at him with great kindness.\n\n“You are like this cup,” he said. “You came a long way and you are already full — of your opinions, your credentials, your certainty about how things are. How can I show you anything until you empty your cup?”\n\nThe professor sat back down. He was quiet for a long time. Then, for the first time in many years, he asked a question he did not already know the answer to.","m":"Start the day empty enough to actually learn something. Certainty is comfortable and it costs you everything new."},{"t":"Two Monks and the River","s":"Two monks, one old and one young, were walking back to their monastery after a long day when they came to a river swollen with spring rain. On the bank stood a woman in fine clothes, afraid to cross. The current was fast and the stones underneath were slick.\n\nWithout a word, the older monk bent down, lifted her onto his back, waded across, and set her gently on dry ground on the other side. She thanked him. He nodded and walked on.\n\nThe younger monk followed in silence. But something was burning in him. Their order was strict: monks did not touch women. Not for any reason. He walked a mile thinking about it. Two miles. Three. The sun went down. He rehearsed what he would say, discarded it, rehearsed it again.\n\nFinally, as the monastery came into view, he could not hold it any longer.\n\n“How could you do that?” he burst out. “You know our vows. You picked her up. You carried her.”\n\nThe old monk kept walking a few more steps, then smiled — not unkindly.\n\n“I set that woman down at the riverbank hours ago,” he said. “Why are you still carrying her?”","m":"Whatever you are still carrying from yesterday — the argument, the email, the thing you should have said — set it down at the bank. You crossed that river already."},{"t":"The Fisherman and the Consultant","s":"A businessman on vacation stood on a small dock watching a fisherman tie up his boat. It was barely past noon. In the bottom of the boat were several beautiful yellowfin tuna.\n\n“How long did it take you to catch those?” the businessman asked.\n\n“Only a little while.”\n\n“So why not stay out longer and catch more?”\n\n“This is enough for my family's needs.”\n\n“But what do you do with the rest of your time?”\n\nThe fisherman thought about it. “I sleep late, fish a little, play with my children, take a nap with my wife in the afternoon. In the evening I walk into the village, drink some wine and play guitar with my friends. I have a full life.”\n\nThe businessman drew himself up. “I have an MBA. Let me help you. You should spend more hours fishing and buy a bigger boat. With the proceeds from the bigger boat you buy several boats — eventually a fleet. Instead of selling your catch to a middleman, you sell directly to the processor, then open your own cannery. You'd control the product, the processing and the distribution. You'd have to leave this village and move to the city, then eventually to New York, to run your expanding enterprise.”\n\n“How long would all this take?”\n\n“Fifteen, maybe twenty years.”\n\n“And then what?”\n\nThe businessman laughed. “Then comes the best part. You announce an IPO, sell your company stock to the public and become very rich. You'd make millions.”\n\n“Millions? And then what?”\n\n“Then you'd retire. Move to a small fishing village, sleep late, fish a little, play with your kids, nap with your wife, and stroll into the village in the evenings to drink wine and play guitar with your friends.”\n\nThe fisherman smiled, picked up his tuna, and headed home.","m":"Make sure the ladder you are climbing is leaning against the right wall. Sometimes you are already standing where the ladder was supposed to take you."},{"t":"The Stonecutter","s":"There was once a stonecutter who was dissatisfied with himself and with his position in life.\n\nOne day he passed a wealthy merchant's house. Through the open gateway he saw fine possessions and important visitors. “How powerful that merchant must be,” thought the stonecutter, and he became very envious. “I wish I could be like him.”\n\nTo his great surprise, he suddenly became the merchant, enjoying more luxury and power than he had ever dreamed of — envied and detested by those less wealthy. Soon a high official passed by, carried in a sedan chair, escorted by attendants and honored by everyone. “How powerful that official is,” he thought. “I wish I could be a high official.”\n\nThen he became the high official, carried everywhere in his embroidered chair, feared and hated by the people. It was a hot summer day, and he felt very uncomfortable. He looked up at the sun. It shone proudly in the sky, unaffected by his presence. “How powerful the sun is,” he thought. “I wish I could be the sun.”\n\nThen he became the sun, shining fiercely down on everyone, scorching the fields. But a huge black cloud moved between him and the earth, so that his light could no longer shine. “How powerful that storm cloud is,” he thought. “I wish I could be a cloud.”\n\nThen he became the cloud, flooding the fields and villages — until he found himself being pushed away by some great force, and realized it was the wind. “How powerful it is,” he thought. “I wish I could be the wind.”\n\nThen he became the wind, blowing tiles off roofs and uprooting trees, feared and hated by all below him — until, after a while, he ran up against something that would not move no matter how forcefully he blew against it: a huge, towering rock. “How powerful that rock is,” he thought. “I wish I could be a rock.”\n\nThen he became the rock, more powerful than anything else on earth. But as he stood there he heard the sound of a hammer pounding a chisel into the hard surface, and felt himself being changed.\n\n“What could be more powerful than I, the rock?” he thought. He looked down and saw, far below him, the figure of a stonecutter.","m":"You already are the thing you are chasing. Stop shopping for a different life and work your own stone."},{"t":"Knowing Where to Tap","s":"A great ship's engine failed at sea and no one on board could fix it. The owner brought in expert after expert. Each one examined the machinery, made adjustments, charged a fee, and left the engine exactly as dead as they found it. Days passed. Cargo sat. Money burned.\n\nFinally the owner sent for an old engineer who had been fixing ships since he was a boy. He arrived carrying a small bag of tools. He did not open it right away. Instead he walked slowly through the engine room, running his hand along the pipes, tilting his head, listening. He watched the pistons for a long time without touching anything. Then he asked for a moment of quiet, and he listened again.\n\nAfter perhaps an hour, he reached into his bag, took out a small hammer, and gently tapped one valve. Immediately the engine lurched into life. He put the hammer away and left.\n\nA week later the owner received an invoice for ten thousand dollars.\n\n“Ten thousand!” the owner sputtered. “You barely did anything! Itemize this bill.”\n\nThe old engineer sent back a new invoice. It read:\n\nTapping with a hammer — $2.00\nKnowing where to tap — $9,998.00","m":"Your years were not wasted. You were not paid for the tap; you are paid for knowing where. Charge accordingly — and stop apologizing for the speed at which you can now do hard things."},{"t":"Salt in the Water","s":"An aging master grew tired of his apprentice's constant complaining. The young man had a real gift for it — he could find the flaw in any day, the insult in any kindness, the disaster waiting inside any piece of good news.\n\nOne morning the master sent him for a handful of salt. When he returned, the master told him to stir the whole handful into a glass of water and drink it down.\n\n“How does it taste?” the master asked.\n\nThe apprentice spat on the ground. “Bitter. Awful.”\n\nThe master chuckled, then said, “Come with me.” The two walked in silence to a lake at the edge of the property. The master told the apprentice to take another handful of salt and throw it into the water. The young man did.\n\n“Now drink from the lake.”\n\nThe apprentice cupped his hands and drank. The master asked, “How does it taste?”\n\n“Fresh. Cold. Good.”\n\n“Do you taste the salt?”\n\n“No.”\n\nThe master sat down on the bank beside the young man and said:\n\n“The pain of life is pure salt — no more, no less. The amount of salt is the same in both cases. But the amount of bitterness we taste depends entirely on the container we put it in. So when you are in pain, the only thing you can do is to enlarge your sense of things. Stop being a glass. Become a lake.”","m":"You cannot always shrink the salt. You can always grow the lake — with breath, with perspective, with people, with a morning that starts before the noise does."},{"t":"The Strawberry","s":"A man walking across a field looked up and saw a tiger. He ran, the tiger after him. Coming to a cliff, he caught hold of the root of a wild vine and swung himself down over the edge. The tiger sniffed at him from above.\n\nTrembling, the man looked down. Far below, another tiger was waiting to eat him. Only the vine sustained him.\n\nTwo mice, one white and one black, little by little started to gnaw away at the vine.\n\nThe man saw a luscious strawberry growing near him on the cliff face. Holding the vine with one hand, he plucked the strawberry with the other.\n\nHow sweet it tasted.","m":"There is a tiger above and a tiger below every single day. Eat the strawberry anyway — and taste it while you do."},{"t":"Diogenes and the Emperor","s":"Alexander the Great had conquered most of the known world by the age of thirty. Cities emptied into the streets when he arrived. Kings sent gifts ahead of his army in the hope of being spared.\n\nIn Corinth, he heard about a philosopher named Diogenes who owned nothing at all — no house, no bed, no possessions beyond a cloak and a wooden bowl. He had given up the bowl after seeing a child drink from cupped hands.\n\nCurious, Alexander went to find him. He discovered the old man lying on the ground in the sun, doing nothing in particular.\n\nAlexander approached with his retinue, stood over the philosopher, and announced himself: he was Alexander, master of Greece and Persia and everything between. He had been moved by the philosopher's poverty. He would grant him anything he wished. Anything at all. Name it.\n\nDiogenes squinted up at the emperor blocking the light.\n\n“Yes,” he said. “Move a little to the left. You're standing in my sun.”\n\nHis officers laughed and jeered. Alexander did not. As they walked away, still mocking the old man, Alexander said quietly: “If I were not Alexander, I would wish to be Diogenes.”","m":"Know what is enough, and half the world's leverage over you quietly disappears."},{"t":"The Jar of Rocks","s":"A professor stood before his class with a wide glass jar and set it on the table. Without a word, he began filling it with rocks about two inches across, until no more would fit.\n\n“Is the jar full?” he asked.\n\nThe students agreed that it was.\n\nHe then picked up a box of small pebbles and poured them in, shaking the jar lightly so they rolled down into the spaces between the rocks. He asked again if the jar was full. The class laughed and said yes.\n\nNext he took a bag of sand and poured it in. It filled everything that was left. “Full now?”\n\n“Yes.”\n\nHe then produced two cups of coffee and poured them into the jar, filling the empty space among the sand. The students laughed out loud.\n\n“Now,” he said, when the laughter died down, “I want you to see that this jar is your life. The rocks are the things that matter most — your health, your family, your friends, the work that is actually yours to do. If everything else was lost and only they remained, your life would still be full.\n\n“The pebbles are the other things that matter — the job, the house, the car. The sand is everything else: the small stuff, the noise, the notifications.\n\n“If you put the sand in first, there is no room for the pebbles or the rocks. If you spend all your energy on the small stuff, you will never have room for the things that are actually important to you. Pay attention to the things that are critical to your happiness. Take care of the rocks first — the rest is just sand.”\n\nA student raised her hand and asked what the coffee represented.\n\n“I'm glad you asked,” the professor said. “It shows that no matter how full your life may seem, there's always room for a cup of coffee with a friend.”","m":"Rocks first. That is exactly what your Top 3 and your WIN are for — they go in the jar before the day starts pouring sand."},{"t":"The Two Arrows","s":"The Buddha once asked a student: “If a person is struck by an arrow, is it painful?”\n\n“It is,” the student said.\n\n“And if the person is struck by a second arrow in exactly the same spot, is that more painful still?”\n\n“It is.”\n\nThe Buddha then explained. In life, we cannot always control the first arrow. A flat tire on the morning you cannot afford one. A cruel word. A diagnosis. A deal that falls through at the last hour. That arrow lands, and it hurts, and that pain is honest.\n\nThe second arrow is the one we fire into ourselves. It is the replaying at 2 a.m. It is the story we tell about what the first arrow means about us — that we are behind, that we are failing, that this always happens to us, that we should have known.\n\nThe first arrow is a wound. The second is a habit.\n\n“In life,” he said, “we cannot always control the first arrow. However, the second arrow is our reaction to the first. And this second arrow is optional.”","m":"Take today's first arrows — they come with the territory. Just stop firing the second ones."},{"t":"The Trouble Tree","s":"A carpenter hired to help restore an old farmhouse had just finished a rough first day on the job. A flat tire made him lose an hour of work, his electric saw quit halfway through the afternoon, and now his ancient pickup truck refused to start.\n\nThe homeowner drove him home. He sat in stony silence the whole way.\n\nOn arriving, he invited his driver in to meet the family. As they walked toward the front door, the carpenter paused briefly at a small tree, touching the tips of the branches with both hands. When he opened the door he underwent an amazing transformation. His tanned face was wreathed in smiles and he hugged his two small children and gave his wife a kiss.\n\nAfterward he walked his guest back to the car. They passed the tree and curiosity got the better of the visitor. He asked about what he had seen the carpenter do earlier.\n\n“Oh, that's my trouble tree,” he replied. “I know I can't help having troubles on the job, but one thing's for sure — troubles don't belong in the house with my wife and the children. So I just hang them up on the tree every night when I come home and ask God to take care of them. Then in the morning I pick them up again.”\n\nHe paused. “Funny thing is,” he smiled, “when I come out in the morning to pick them up, there aren't nearly as many as I remember hanging up the night before.”","m":"Build yourself a trouble tree. The people in that house get the best of you, not what's left of you — and half the troubles evaporate overnight anyway."},{"t":"The Window","s":"Two men, both seriously ill, occupied the same hospital room. One man was allowed to sit up in his bed for an hour each afternoon to help drain the fluid from his lungs. His bed was next to the room's only window. The other man had to spend all his time flat on his back.\n\nThe men talked for hours. They spoke of their wives and families, their homes, their jobs, their time in the service, where they had been on vacation.\n\nAnd every afternoon, when the man in the bed by the window could sit up, he would pass the time by describing to his roommate all the things he could see outside.\n\nThe man in the other bed began to live for those one-hour periods where his world would be broadened and enlivened by all the activity and color of the world outside. The window overlooked a park with a lovely lake. Ducks and swans played on the water while children sailed their model boats. Young lovers walked arm in arm amid flowers of every color, and a fine view of the city skyline could be seen in the distance.\n\nAs the man by the window described all this in exquisite detail, the man on the other side of the room would close his eyes and imagine the picturesque scene.\n\nOne warm afternoon the man by the window described a parade passing by. Although the other man could not hear the band, he could see it in his mind's eye.\n\nDays and weeks passed. One morning, the day nurse arrived to find the lifeless body of the man by the window, who had died peacefully in his sleep.\n\nAs soon as it seemed appropriate, the other man asked if he could be moved next to the window. The nurse was happy to make the switch, and after making sure he was comfortable, she left him alone.\n\nSlowly, painfully, he propped himself up on one elbow to take his first look at the world outside. Finally, he would have the joy of seeing it for himself. He strained to slowly turn to look out the window beside the bed.\n\nIt faced a blank wall.\n\nThe man called the nurse and asked what could have compelled his deceased roommate to describe such wonderful things outside this window.\n\nThe nurse responded that the man had been blind and could not even see the wall.\n\n“Perhaps,” she said, “he just wanted to encourage you.”","m":"You can hand somebody a better world just by how you choose to describe this one. That costs you nothing and it is not a small thing."},{"t":"The Last House","s":"An elderly carpenter was ready to retire. He told his employer-contractor of his plans to leave the house-building business and live a more leisurely life with his wife, enjoying his extended family.\n\nHe would miss the paycheck, but he needed to retire. They could get by.\n\nThe contractor was sorry to see his good worker go and asked if he could build just one more house as a personal favor. The carpenter said yes, but in time it was easy to see that his heart was not in his work. He resorted to shoddy workmanship and used inferior materials. It was an unfortunate way to end a dedicated career.\n\nHe rushed the framing. He skipped the small corrections he would once have insisted on. He told himself it did not matter — it was the last one.\n\nWhen the carpenter finished his work, his employer came to inspect the house. Then he handed the front-door key to the carpenter.\n\n“This is your house,” he said. “My gift to you.”\n\nThe carpenter was shocked, and then ashamed. If he had only known he was building his own house, he would have done it all so differently. Now he had to live in the home he had built none too well.","m":"You are always building the house you will live in — the habits, the marriage, the body, the reputation. Build today like you are staying."},{"t":"This Too Shall Pass","s":"A powerful king, weary of being tossed between elation and despair, called his wise men together. He asked them for one thing: a sentence, short enough to fit on a ring, that would be true in every possible situation. Something to steady him whether he was celebrating a victory or standing in the ruins of a defeat.\n\nThe wise men argued for weeks. Finally they returned with a simple gold ring. Engraved inside it were four words:\n\nThis too shall pass.\n\nIn the years that followed, the king wore it constantly. When his armies won and the crowds chanted his name and he felt himself becoming something more than a man, he would turn the ring on his finger and read it, and the arrogance would drain out of him.\n\nAnd on the night his most trusted friend betrayed him, and later in the long winter when the harvest failed and he could not sleep, he would read it again — and this time it did not humble him. It carried him.","m":"Whatever today turns out to be — brilliant or brutal — it is weather, not climate. Hold the good loosely and the bad lightly."},{"t":"Sharpening the Axe","s":"Two woodcutters, one young and strong, one older, made a bet on who could fell more trees in a single day.\n\nAt sunrise they started. The young man attacked the forest without pause — no water, no rest, no lunch. Every time he glanced over, he noticed the older man had stopped again and was sitting down at the edge of the clearing. The young man grinned to himself and swung harder.\n\nEvery hour, the older man disappeared for about ten minutes, then came back and worked steadily until the next break.\n\nAt sundown they counted. The older man's pile was clearly larger.\n\nThe young man was furious. “I don't understand. I worked through every single break you took. I never stopped. How could you cut more than me?”\n\nThe older woodcutter picked up his axe and turned it so the last of the light caught the edge.\n\n“Every time I sat down,” he said, “I was sharpening my axe.”","m":"Your breaks are not stolen from the work. They are the work. That is the entire reason this app exists — five quiet minutes at dawn is you sharpening the axe."},{"t":"The Farmer's Horse","s":"There was an old farmer who had worked his crops for many years. One day his horse ran away. Upon hearing the news, his neighbors came to visit.\n\n“Such bad luck,” they said sympathetically.\n\n“We'll see,” the farmer replied.\n\nThe next morning the horse returned, bringing with it three other wild horses. “How wonderful,” the neighbors exclaimed.\n\n“We'll see,” replied the old man.\n\nThe following day, his son tried to ride one of the untamed horses, was thrown, and broke his leg. The neighbors again came to offer their sympathy on his misfortune.\n\n“We'll see,” answered the farmer.\n\nThe day after, military officials came to the village to draft young men into the army. Seeing that the son's leg was broken, they passed him by. The neighbors congratulated the farmer on how well things had turned out.\n\n“We'll see,” said the farmer.","m":"You almost never know, on the day it happens, whether a thing is good news or bad news. Rushing to judge it just costs you the peace you could have had while waiting to find out."},{"t":"The Cracked Pot","s":"A water bearer in India had two large pots hanging on each end of a pole which he carried across his neck. One of the pots had a crack in it while the other pot was perfect and always delivered a full portion of water.\n\nAt the end of the long walk from the stream to the house, the cracked pot arrived only half full.\n\nFor two full years this went on daily, with the bearer delivering only one and a half pots full of water to his house. Of course, the perfect pot was proud of its accomplishments. But the poor cracked pot was ashamed of its own imperfection, and miserable that it was able to accomplish only half of what it had been made to do.\n\nAfter two years of what it perceived to be a bitter failure, it spoke to the water bearer one day by the stream.\n\n“I am ashamed of myself, and I want to apologize to you. I have been able to deliver only half my load because this crack in my side causes water to leak out all the way back to your house. Because of my flaws, you have to do all of this work, and you don't get full value from your efforts.”\n\nThe bearer said, “As we return to the house, I want you to notice the beautiful flowers along the path.”\n\nIndeed, as they went up the hill, the old cracked pot took notice of the sun warming the beautiful wild flowers on the side of the path, and this cheered it some. But at the end of the trail, it still felt bad because it had leaked out half its load, and so again it apologized to the bearer for its failure.\n\nThe bearer said to the pot, “Did you notice that there were flowers only on your side of the path, but not on the other pot's side? That's because I have always known about your flaw, and I took advantage of it. I planted flower seeds on your side of the path, and every day while we walk back from the stream, you've watered them.\n\n“For two years I have been able to pick these beautiful flowers to decorate the table. Without you being just the way you are, there would not be this beauty to grace the house.”","m":"The thing you keep apologizing for is often the thing that waters the flowers. Stop trying to be a perfect pot."},{"t":"Two Rabbits","s":"There is an old hunting proverb short enough to carve on the handle of a knife: the man who chases two rabbits catches neither.\n\nThat is the whole story. There is no twist, no wise master, no clever ending. A hunter sees two rabbits break in two directions. He wants both. He commits to neither. He turns halfway toward one, then halfway back toward the other, and by the time he decides, both are gone and he goes home hungry — having run just as hard as the man who came home fed.\n\nThe rabbit does not need a plot. Neither does your list.","m":"Pick the one rabbit. That is precisely why today has exactly one WIN and not five."},{"t":"Is That So?","s":"A Zen master named Hakuin lived in a village where he was respected by everyone. People came to him for advice and left calmer than they arrived.\n\nOne day a girl in the village became pregnant. Her furious parents demanded to know the father's name. She would not say. Pressed for weeks, frightened, she finally named Hakuin.\n\nThe parents went to him in a rage and accused him in front of the whole village.\n\n“Is that so?” was all he said.\n\nHis reputation was gone by nightfall. People who had trusted him for twenty years stopped coming. When the baby was born, the parents brought the infant to Hakuin and left it with him. He took the child in. He begged milk from the neighbors who now despised him, and food, and clothing. Some spat. He raised the child anyway, through a year of it.\n\nAfter that year, the girl could not stand it any longer. She told her parents the truth: the father was a young man who worked at the fish market.\n\nHer parents went straight to Hakuin, prostrated themselves, apologized at great length, begged his forgiveness, and asked for the child back.\n\nHakuin handed the baby over gently and made sure the blanket was tucked in.\n\n“Is that so?” he said.","m":"Your reputation is other people's business. Your conduct is yours. Hold the first loosely enough that it cannot make you abandon the second."},{"t":"The Gift of Insults","s":"Near Tokyo lived a great samurai, now old, who had begun teaching Zen to young people. Despite his age, the legend was that he could defeat any adversary.\n\nOne afternoon a warrior known for his complete lack of scruples arrived. He was famous for using the technique of provocation: he waited until his opponent made the first move, and then, with his exceptional intelligence for counter-attack, he won.\n\nThe young warrior had never lost a battle. Hearing of the samurai's reputation, he had come to defeat him and increase his own fame.\n\nAll the students were against the idea, but the old man accepted.\n\nThey gathered in the town square, and the young man began insulting the old master. He threw dirt in his face. He spat. He shouted every insult known, and several he appeared to have invented. He questioned his ancestry. For hours he worked, and the old samurai simply remained there, motionless and calm.\n\nAt the end of the afternoon, feeling exhausted and humiliated, the young warrior left.\n\nThe students were disappointed and said so — how could their master accept such indignity in public?\n\n“For hours he insulted you. Why didn't you use your sword? Weren't you afraid you might lose the fight, instead of looking like a coward in front of us all?”\n\n“If someone comes to you with a gift,” the old man replied, “and you do not accept it — to whom does the gift belong?”\n\n“To the one who tried to give it,” answered one of the students.\n\n“The same goes for envy, anger and insults,” said the master. “When they are not accepted, they continue to belong to the one who carried them.”","m":"Someone else's anger only becomes yours at the moment you pick it up. Leave it in their hands today."},{"t":"The Empty Boat","s":"A man was crossing a river in his small boat when he saw another boat coming straight at him. He shouted for it to turn. It kept coming. He shouted again, louder. It came on.\n\nHe stood up and screamed insults at the fool who was about to hit him — where were his eyes, what kind of idiot rows blind down the middle of a river — and braced for the collision.\n\nThe boats struck. He stumbled. And then he looked, and saw that the other boat was empty. It had come loose from a mooring somewhere upstream and drifted down on the current.\n\nHe pushed it off with his oar and rowed on.\n\nZhuangzi, who told this story, asked a simple question about it. The collision was the same either way. The dent in the hull was the same. So where did all that shouting come from?\n\nIt came from the man he had imagined in the other boat.\n\n“If you can empty your own boat crossing the river of the world,” he wrote, “no one will oppose you, no one will seek to harm you.”","m":"Most of what happens to you today will be an empty boat. The traffic, the delay, the short reply. Nobody is steering it at you."},{"t":"The Useless Tree","s":"A carpenter traveling with his apprentice passed an enormous oak beside a village shrine. It was old enough that a hundred men could not have circled it. Its shade could cover a herd of oxen.\n\nThe apprentice stopped and stared. He had never seen timber like it. But his master walked straight past without slowing.\n\n“Since I took up my axe,” the apprentice said, catching up, “I have never seen a tree like that. Why won't you even look at it?”\n\n“It is worthless,” the carpenter said. “Make a boat of it and the boat sinks. Make a coffin and it rots at once. Make a door and it weeps sap. Make a pillar and the worms take it. It is a tree of no quality. That is why it has lived so long.”\n\nThat night the oak appeared to the carpenter in a dream.\n\n“What are you comparing me to?” it asked. “The pear, the orange, the useful fruiting trees? They are torn apart the moment their fruit is ripe. Their branches are broken, their limbs stripped. Their own usefulness makes their lives miserable, and they do not last out their natural years.\n\n“I have spent a long time learning to be of no use. And now, old as I am, it is of great use — to me. If I had been useful, would I ever have grown this large?”","m":"Not everything about you has to be productive. The parts of your life with no obvious use are often what let the rest of it stand."},{"t":"The Monkey's Fist","s":"In parts of southern India and North Africa, trappers have used the same device for centuries, and it costs almost nothing.\n\nYou take a heavy jar or a hollowed coconut and fix it to a stake in the ground. You cut a hole in the top — carefully sized, just wide enough for a monkey's open hand to slip through. Then you put a handful of rice inside.\n\nThe monkey comes. It smells the rice, reaches in, and closes its fist around as much as it can hold.\n\nAnd now its hand will not come out. The fist is wider than the hole.\n\nThe trapper walks up. He does not hurry, because he does not need to. The monkey shrieks and pulls and thrashes and will not let go of the rice. It could be free in an instant — one small motion, and the hand slides out — but that would mean releasing what it came for.\n\nEvery monkey caught this way is caught by its own grip. Nothing holds it but what it is holding.","m":"Look for the thing you are gripping that you are calling a trap. The hand opens whenever you decide it does."},{"t":"The Blind Men and the Elephant","s":"A king in an old Indian story grew tired of his scholars arguing about the nature of truth, so he arranged a demonstration.\n\nHe gathered six men who had been blind from birth and had never encountered an elephant, and had an elephant brought into the courtyard. Each man was led to a different part of the animal and asked to describe what he found.\n\nThe first took hold of the trunk and said an elephant is like a thick snake.\n\nThe second felt an ear and said no, it is like a fan.\n\nThe third put his hands on a leg and said both were wrong: an elephant is like the pillar of a temple.\n\nThe fourth reached the side and said it is a wall.\n\nThe fifth found the tusk and said it is smooth and hard, like a spear.\n\nThe sixth caught the tail and said an elephant is a rope, nothing more.\n\nThey argued. Then they shouted. Each of them was describing exactly what he had found, honestly and accurately, and each of them called the others liars.\n\nThe king let it run for a while, and then he said: “The elephant is a large animal. Each of you has touched one part. You must put the parts together to know the whole.”","m":"The person disagreeing with you today may be reporting the tail honestly. Ask what they are touching before you decide they are wrong."},{"t":"Nasrudin's Key","s":"A neighbor came upon Nasrudin on his hands and knees under a streetlamp, sweeping his palms across the dust.\n\n“What have you lost, Mulla?”\n\n“My key,” said Nasrudin. “I've dropped my key.”\n\nSo the neighbor got down beside him, and the two of them searched the circle of light. They went over it once, then again, more carefully. Nothing. Other neighbors came out and joined in. Soon half the street was on its knees under the lamp.\n\nAfter an hour someone finally asked the obvious question.\n\n“Mulla — where exactly were you when you dropped it?”\n\n“In my house,” said Nasrudin.\n\n“Then why on earth are we looking here?”\n\n“There is more light here.”","m":"Notice where you're searching. Comfortable ground is not the same as the right ground, and an hour spent on the wrong one is still an hour."},{"t":"The Smuggler","s":"Every week for years, Nasrudin crossed the border with a donkey loaded with straw.\n\nThe customs official knew — absolutely knew — that he was smuggling something. Nasrudin was visibly getting richer, and nobody gets rich carrying straw. So every week the official took the load apart. He unpacked the panniers. He ran the straw through his hands, burned samples, soaked samples, weighed the donkey, weighed the straw, weighed the donkey again. He searched the saddle, the blanket, Nasrudin's clothes, Nasrudin's shoes.\n\nHe never found a thing. Every week he waved him through, furious.\n\nYears later, both men had retired, and they met by chance in a teahouse on the other side of the border, where nothing could be done about anything anymore.\n\n“Nasrudin,” the old official said. “I have to know. It is going to follow me to my grave. You were smuggling something. What was it?”\n\n“Donkeys,” said Nasrudin.","m":"Sometimes the thing you keep failing to find is the thing you're looking straight past, because you've already decided it's just the container."},{"t":"The Three Sieves","s":"A man came running up to Socrates in the street with news he could not wait to deliver.\n\n“Socrates! Do you know what I just heard about your friend?”\n\n“Hold on a moment,” Socrates said. “Before you tell me, I'd like you to pass it through three sieves.”\n\n“Three sieves?”\n\n“The first is truth. Are you absolutely certain that what you are about to tell me is true?”\n\n“Well — no. I only heard it. From someone who heard it.”\n\n“So you don't know if it's true. Let's try the second sieve, which is goodness. Is what you're about to tell me about my friend something good?”\n\n“No,” the man admitted. “Rather the opposite.”\n\n“So you want to tell me something bad about him, and you're not sure it's even true. There's one sieve left, and it's usefulness. Is this news going to be useful to me?”\n\n“Not really.”\n\n“Well then,” said Socrates. “If what you want to tell me is neither true, nor good, nor useful — why tell it to me at all?”","m":"Before you repeat it today, run it through the three: true, good, useful. Most of what we pass along fails all three."},{"t":"The Sword of Damocles","s":"Damocles was a courtier in the court of Dionysius, tyrant of Syracuse, and he was a flatterer by trade. He spoke often of how fortunate the king was — the wealth, the power, the banquets, the deference of every person in the room.\n\nDionysius, who was tired of hearing it, made him an offer. Would Damocles like to trade places for a day and find out what it was actually like?\n\nDamocles accepted immediately.\n\nHe was seated on the golden couch. Servants brought him wine and dishes he had never tasted. Musicians played. Perfumed attendants stood ready for any gesture he made. For a while it was everything he had imagined, and he was radiant.\n\nThen he happened to look up.\n\nDirectly above the couch, suspended from the ceiling, hung an enormous sword. It was held by a single hair from a horse's tail.\n\nDamocles could not eat after that. The food was still there, the music was still playing, the servants still waited —
